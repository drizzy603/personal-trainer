// ── PROGRESS ──────────────────────────────────────────────────────────────────
function renderProgress() {
  var sessions=getSessions();
  var runs=getRuns();
  var wd=getWkData();

  // Dynamic goals — find bests from logged data
  var bestBench=0, bestSquat=0, bestRun5kSec=0;
  sessions.forEach(function(s){
    (s.exercises||[]).forEach(function(ex){
      var w=parseFloat(ex.weight)||0;
      if(ex.name==='Barbell Bench Press'&&w>bestBench) bestBench=w;
      if((ex.name==='Barbell Back Squat'||ex.name==='Back Squat')&&w>bestSquat) bestSquat=w;
    });
  });
  runs.forEach(function(r){
    var dist=parseFloat(r.distance||r.dist||0);
    if(dist<4.5) return; // must be ~5k
    var parts=(r.time||'').split(':').map(Number);
    var secs=parts.length===2?parts[0]*60+(parts[1]||0):parts[0]*3600+parts[1]*60+(parts[2]||0);
    if(secs>0&&(bestRun5kSec===0||secs<bestRun5kSec)) bestRun5kSec=secs;
  });

  function goalBar(label,current,target,unit,lowerBetter){
    var pct=target>0?Math.min(100,Math.round((current/target)*100)):0;
    if(lowerBetter&&target>0) pct=current>0?Math.min(100,Math.round((target/current)*100)):0;
    var color=pct>=100?'var(--green)':pct>=70?'var(--accent)':'var(--yellow)';
    var currentStr=current>0?(lowerBetter?secToPace(current/5):current+' '+unit):'—';
    var targetStr=lowerBetter?secToPace(target/5)+' /km':target+' '+unit;
    return '<div style="margin-bottom:16px;">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">'+
        '<div style="font-size:13px;font-weight:800;">'+label+'</div>'+
        '<div style="font-size:11px;color:var(--muted);font-weight:700;">'+currentStr+' / '+targetStr+'</div>'+
      '</div>'+
      '<div style="background:var(--bg);border-radius:2px;height:6px;">'+
        '<div style="height:6px;border-radius:2px;background:'+color+';width:'+pct+'%;transition:width .4s;"></div>'+
      '</div>'+
      (pct>=100?'<div style="font-size:10px;color:var(--green);margin-top:4px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;">✓ Goal reached</div>':'<div style="font-size:10px;color:var(--muted);margin-top:4px;font-weight:700;">'+pct+'%</div>')+
    '</div>';
  }

  var run5kGoalSec=40*60;
  var goals='<div class="chart-card"><h2 style="margin-bottom:14px;">Goals</h2>'+
    goalBar('Bench Press',bestBench,175,'lb',false)+
    goalBar('Back Squat',bestSquat,150,'lb',false)+
    (bestRun5kSec>0?goalBar('5k Time',bestRun5kSec,run5kGoalSec,'',true):'<div style="font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:500;">5k — log a ~5 km run to track pace</div>')+
    '</div>';

  var streak=calcStreak(sessions);
  var lastVol=sessions.length?calcVolume(sessions[0].exercises||[]):0;
  var bws=getBodyWeights();
  var latestBW = bws.length ? bws[0].weight : null;
  var prevBW = bws.length > 1 ? bws[1].weight : null;
  var bwDelta = (latestBW && prevBW) ? (latestBW - prevBW).toFixed(1) : null;

  var stats='<div class="stat-row">'+
    '<div class="stat">'+
      '<div class="stat-lbl">Sessions</div>'+
      '<div class="stat-val">'+sessions.length+'</div>'+
      (lastVol?'<div class="stat-delta">'+lastVol.toLocaleString()+' lb last</div>':'')+
    '</div>'+
    '<div class="stat">'+
      '<div class="stat-lbl">Streak</div>'+
      '<div class="stat-val" style="color:var(--orange)">'+streak+'</div>'+
    '</div>'+
    '</div>'+
    '<div class="stat-row">'+
    (latestBW?
      '<div class="stat">'+
        '<div class="stat-lbl">Bodyweight</div>'+
        '<div><span class="stat-val">'+latestBW+'</span><span style="font-size:14px;color:var(--muted);margin-left:4px;font-weight:500;">lb</span></div>'+
        (bwDelta?'<div class="stat-delta '+(parseFloat(bwDelta)>0?'down':'')+'">'+
          (parseFloat(bwDelta)>0?'↑ +':'↓ ')+Math.abs(bwDelta)+' lb</div>':'')+
      '</div>':'')+
    '<div class="stat">'+
      '<div class="stat-lbl">Week</div>'+
      '<div class="stat-val" style="color:var(--accent)">W'+currentWeek+'</div>'+
    '</div>'+
    '</div>';

  var benchData=[];
  for(var i=sessions.length-1;i>=0&&benchData.length<10;i--){
    var s=sessions[i];
    if(s.type!=='Push') continue;
    (s.exercises||[]).forEach(function(ex){
      if(ex.name==='Barbell Bench Press'&&parseFloat(ex.weight)>0&&benchData.length<10)
        benchData.push({date:s.date,val:parseFloat(ex.weight)});
    });
  }
  benchData.reverse();

  var squatData=[];
  for(var i=sessions.length-1;i>=0&&squatData.length<10;i--){
    var s=sessions[i];
    if(s.type!=='Legs') continue;
    (s.exercises||[]).forEach(function(ex){
      if((ex.name==='Barbell Back Squat'||ex.name==='Back Squat')&&parseFloat(ex.weight)>0&&squatData.length<10)
        squatData.push({date:s.date,val:parseFloat(ex.weight)});
    });
  }
  squatData.reverse();

  var benchChart=benchData.length>=2
    ?'<div class="chart-card"><div class="chart-head"><div><div class="chart-lbl">Bench Press · working weight</div>'+
      '<div><span class="chart-val">'+benchData[benchData.length-1].val+'</span><span class="chart-unit">lb</span></div>'+
      (benchData.length>=2?'<div class="chart-delta">↑ '+(benchData[benchData.length-1].val-benchData[0].val)+' lb total</div>':'')+
      '</div></div>'+svgChart(benchData,'#c8ff00')+'</div>'
    :'';

  var squatChart=squatData.length>=2
    ?'<div class="chart-card"><div class="chart-head"><div><div class="chart-lbl">Back Squat · working weight</div>'+
      '<div><span class="chart-val">'+squatData[squatData.length-1].val+'</span><span class="chart-unit">lb</span></div>'+
      (squatData.length>=2?'<div class="chart-delta">↑ '+(squatData[squatData.length-1].val-squatData[0].val)+' lb total</div>':'')+
      '</div></div>'+svgChart(squatData,'#fb923c')+'</div>'
    :'';

  var runData=[];
  runs.slice().reverse().slice(-10).forEach(function(run){
    var dist=parseFloat(run.distance||run.dist||0);
    var parts=(run.time||'').split(':').map(Number);
    var secs=parts.length===3?parts[0]*3600+parts[1]*60+(parts[2]||0):parts[0]*60+(parts[1]||0);
    if(secs&&dist) runData.push({date:run.date,val:Math.round(secs/dist)});
  });

  var runGoalSec=paceToSec(getRunGoal());
  var runChart=runData.length>=2
    ?'<div class="chart-card"><div class="chart-head"><div><div class="chart-lbl">Run pace · sec/km (lower = faster)</div>'+
      (runGoalSec?'<div class="chart-delta">Goal: '+getRunGoal()+'/km</div>':'')+
      '</div></div>'+svgChart(runData,'#c8ff00',runGoalSec)+'</div>'
    :'';

  // 1RM calculator (Epley)
  var bestBenchRM=0, bestSquatRM=0;
  sessions.forEach(function(s){
    (s.exercises||[]).forEach(function(ex){
      var w=parseFloat(ex.weight)||0; if(!w) return;
      var repsArr=Array.isArray(ex.reps)?ex.reps:[ex.reps];
      var avgReps=repsArr.reduce(function(a,b){return a+(parseFloat(b)||0);},0)/(repsArr.length||1);
      var rm=Math.round(w*(1+avgReps/30));
      if(ex.name==='Barbell Bench Press'&&rm>bestBenchRM) bestBenchRM=rm;
      if((ex.name==='Barbell Back Squat'||ex.name==='Back Squat')&&rm>bestSquatRM) bestSquatRM=rm;
    });
  });
  var rmSection=(bestBenchRM||bestSquatRM)?
    '<div class="chart-card"><div class="chart-head"><div><div class="chart-lbl">Est. 1RM (Epley formula)</div></div></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;">'+
    (bestBenchRM?'<div class="stat" style="margin:0;"><div class="stat-lbl">Bench</div><div class="stat-val" style="color:var(--accent)">'+bestBenchRM+'</div><div style="font-size:12px;color:var(--muted)">lb</div></div>':'')+
    (bestSquatRM?'<div class="stat" style="margin:0;"><div class="stat-lbl">Squat</div><div class="stat-val" style="color:var(--orange)">'+bestSquatRM+'</div><div style="font-size:12px;color:var(--muted)">lb</div></div>':'')+
    '</div></div>':'';

  // Volume trend
  function getVolTrend(type){
    var data=[];
    for(var i=sessions.length-1;i>=0&&data.length<8;i--){
      var s=sessions[i]; if(s.type!==type) continue;
      var vol=calcVolume(s.exercises||[]);
      if(vol>0) data.push({date:s.date,val:vol});
    }
    return data.reverse();
  }
  var pushVol=getVolTrend('Push'), pullVol=getVolTrend('Pull'), legsVol=getVolTrend('Legs');
  var volCharts='';
  if(pushVol.length>=2||pullVol.length>=2||legsVol.length>=2){
    volCharts='<div class="chart-card"><div class="chart-lbl" style="margin-bottom:14px;">Volume · total lb per session</div>';
    if(pushVol.length>=2) volCharts+='<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:6px;">Push</div>'+svgChart(pushVol,'#c8ff00')+'</div>';
    if(pullVol.length>=2) volCharts+='<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:600;color:var(--cyan);margin-bottom:6px;">Pull</div>'+svgChart(pullVol,'#60a5fa')+'</div>';
    if(legsVol.length>=2) volCharts+='<div style="margin-bottom:4px;"><div style="font-size:12px;font-weight:600;color:var(--orange);margin-bottom:6px;">Legs</div>'+svgChart(legsVol,'#fb923c')+'</div>';
    volCharts+='</div>';
  }

  var bwData=bws.slice(0,10).reverse().map(function(e){return {date:e.date,val:e.weight};});
  var bwGoal=getBWGoal();
  var bwChart=bwData.length>=2
    ?'<div class="chart-card"><div class="chart-head"><div>'+
        '<div class="chart-lbl">Body Weight</div>'+
        '<div><span class="chart-val">'+bwData[bwData.length-1].val+'</span><span class="chart-unit">lb</span></div>'+
        (bwGoal?'<div class="chart-delta">Goal: '+bwGoal+' lb</div>':'')+
      '</div></div>'+
      svgChart(bwData,'#60a5fa',bwGoal)+'</div>'
    :(bws.length?'':'<div class="chart-card"><div class="empty"><p>Log weigh-ins in the Log tab</p></div></div>');

  var calHTML=renderCalendar(sessions,runs);

  var wd2=getWkData();
  var progressHeader='<div class="screen-hd">'+
    '<div>'+
      '<div class="screen-eyebrow">'+(wd2?'Week '+currentWeek+' · '+wd2.bName:'')+'</div>'+
      '<div class="screen-title">Progress</div>'+
    '</div>'+
    '<div class="screen-avatar">K</div>'+
  '</div>';

  // ── Lifts this block ──────────────────────────────────────────────────────
  var wd2b = getWkData();
  var blockNum = wd2b ? wd2b.block : 1;
  // Find first week of current block
  var blockStartWk = 1;
  for (var bw = 1; bw < WEEK_DATA.length; bw++) {
    if (WEEK_DATA[bw] && WEEK_DATA[bw].block === blockNum) { blockStartWk = bw; break; }
  }
  var wdStart = WEEK_DATA[blockStartWk];

  var liftDefs = [
    { label:'Bench Press', sessKey:'push', dataName:'Barbell Bench Press' },
    { label:'Back Squat',  sessKey:'legs', dataName:'Barbell Back Squat'  },
    { label:'Pull-ups',    sessKey:'pull', dataName:'Pull Up'             },
  ];

  var liftRows = '';
  liftDefs.forEach(function(lift) {
    var startArr = wdStart ? wdStart[lift.sessKey] : null;
    var curArr   = wd2b   ? wd2b[lift.sessKey]    : null;
    var startMain = null, curMain = null;
    if (startArr) { for (var li=0;li<startArr.length;li++){if(startArr[li].isMain){startMain=startArr[li];break;}} }
    if (curArr)   { for (var li=0;li<curArr.length;li++){if(curArr[li].isMain){curMain=curArr[li];break;}}   }
    if (!startMain && !curMain) return;
    var startW = startMain ? startMain.weight : 0;
    var curW   = curMain   ? curMain.weight   : startW;
    // Boost curW with best logged weight
    sessions.forEach(function(s) {
      if (s.type !== (lift.sessKey.charAt(0).toUpperCase()+lift.sessKey.slice(1))) return;
      (s.exercises||[]).forEach(function(ex) {
        if (ex.name === lift.dataName) { var w=parseFloat(ex.weight)||0; if(w>curW) curW=w; }
      });
    });
    var delta = curW - startW;
    var maxExpectedGain = 30; // lb per block for display purposes
    var pct = startW > 0 ? Math.min(100, Math.max(4, Math.round((delta / maxExpectedGain) * 100))) : 0;
    var wLabel = curMain && curMain.weight === 0 ? 'Bodyweight' : curW+' lb';
    liftRows += '<div class="lift-row">'+
      '<div class="lift-head">'+
        '<span class="lift-name">'+lift.label+'</span>'+
        (delta > 0 ? '<span class="lift-delta">+'+delta+' lb</span>' : (delta < 0 ? '<span class="lift-delta" style="color:var(--orange)">'+delta+' lb</span>' : ''))+
      '</div>'+
      '<div class="lift-bar"><div class="lift-fill" style="width:'+(delta>0?pct:4)+'%"></div></div>'+
      '<div class="lift-meta"><span>'+startW+(startMain&&startMain.weight===0?'BW':' lb')+' start</span><span>'+wLabel+' now</span></div>'+
    '</div>';
  });

  var liftsBlock = liftRows
    ? '<div class="chart-card"><div class="chart-head"><div><div class="chart-lbl">'+(wd2b?wd2b.bName+' block':'Current block')+' · strength progression</div></div></div>'+liftRows+'</div>'
    : '';

  return progressHeader+stats+goals+liftsBlock+rmSection+bwChart+benchChart+squatChart+runChart+volCharts+calHTML;
}

function svgChart(data,color,goalVal) {
  var W=320,H=120,PL=40,PR=10,PT=10,PB=24;
  var iW=W-PL-PR,iH=H-PT-PB;
  var vals=data.map(function(d){return d.val;});
  if(goalVal) vals.push(goalVal);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=mx-mn||1;
  function px(i){return PL+(i/(data.length-1))*iW;}
  function py(v){return PT+iH-((v-mn)/rng)*iH;}
  var pts=data.map(function(d,i){return px(i)+','+py(d.val);}).join(' ');
  var dots=data.map(function(d,i){return '<circle cx="'+px(i)+'" cy="'+py(d.val)+'" r="4" fill="'+color+'"/>';}).join('');
  var goalLine='';
  if(goalVal&&goalVal>=mn&&goalVal<=mx){
    var gy=py(goalVal);
    goalLine='<line x1="'+PL+'" y1="'+gy+'" x2="'+(PL+iW)+'" y2="'+gy+'" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>'+
      '<text x="'+(PL-4)+'" y="'+(gy+4)+'" fill="#22c55e" font-size="9" text-anchor="end">'+goalVal+'</text>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;">'+
    '<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+iH)+'" stroke="#222" stroke-width="1"/>'+
    '<line x1="'+PL+'" y1="'+(PT+iH)+'" x2="'+(PL+iW)+'" y2="'+(PT+iH)+'" stroke="#222" stroke-width="1"/>'+
    goalLine+
    '<text x="'+(PL-4)+'" y="'+(PT+6)+'" fill="#444" font-size="9" text-anchor="end" font-weight="700">'+Math.round(mx)+'</text>'+
    '<text x="'+(PL-4)+'" y="'+(PT+iH)+'" fill="#444" font-size="9" text-anchor="end" font-weight="700">'+Math.round(mn)+'</text>'+
    '<text x="'+PL+'" y="'+(H-2)+'" fill="#444" font-size="9" font-weight="700">'+data[0].date.slice(5)+'</text>'+
    '<text x="'+(PL+iW)+'" y="'+(H-2)+'" fill="#444" font-size="9" text-anchor="end" font-weight="700">'+data[data.length-1].date.slice(5)+'</text>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+'</svg>';
}

// ── CALENDAR ─────────────────────────────────────────────────────────────────
function calNav(delta){
  calMonth+=delta;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  calSelectedDate=null;
  render();
}
function selectCalDate(d){
  calSelectedDate=(calSelectedDate===d)?null:d;
  // re-render just the detail pane
  var el=document.getElementById('cal-detail');
  if(el) el.innerHTML=renderCalDetail(getSessions(),getRuns());
  // highlight selected cell
  document.querySelectorAll('.cal-day').forEach(function(c){
    c.style.background=c.getAttribute('data-date')===calSelectedDate?'var(--accent)':'';
    c.style.color=c.getAttribute('data-date')===calSelectedDate?'#000':'';
  });
}
function renderCalDetail(sessions,runs){
  if(!calSelectedDate) return '<div style="font-size:13px;color:var(--muted);text-align:center;padding:14px 0;">Tap a day to see what you did</div>';
  var daySessions=sessions.filter(function(s){return s.date===calSelectedDate;});
  var dayRuns=runs.filter(function(r){return r.date===calSelectedDate;});
  if(!daySessions.length&&!dayRuns.length) return '<div style="font-size:13px;color:var(--muted);text-align:center;padding:14px 0;">Rest day</div>';
  var html='';
  daySessions.forEach(function(s){
    var def=SESS[s.type]||{icon:'',label:s.type};
    var sessionPRs=s.prs||[];
    var exRows='';
    (s.exercises||[]).forEach(function(ex){
      var isPR=sessionPRs.indexOf(ex.name)>-1;
      var repsDisplay=Array.isArray(ex.reps)?ex.reps.join('/'):ex.reps;
      var wStr=parseFloat(ex.weight)>0?ex.weight+' lb':'BW';
      exRows+='<div class="hist-ex-row">'+
        '<div class="hist-ex-top"><span class="hist-ex-name">'+ex.name+'</span>'+
        '<span class="hist-ex-weight">'+wStr+'</span></div>'+
        '<div class="hist-ex-detail">'+ex.sets+'×('+repsDisplay+') · RPE '+ex.rpe+'</div>'+
        (ex.note?'<div class="hist-ex-note">'+ex.note+'</div>':'')+
      '</div>';
    });
    html+='<div style="margin-bottom:10px;">'+
      '<div style="font-size:14px;font-weight:800;margin-bottom:8px;letter-spacing:-.2px;">'+def.label+(s.week?' · Wk '+s.week:'')+'</div>'+
      exRows+
      (s.note?'<div style="font-size:12px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">'+s.note+'</div>':'')+
    '</div>';
  });
  dayRuns.forEach(function(r){
    var dist=parseFloat(r.distance||r.dist||0);
    var p=calcPace(dist,r.time);
    html+='<div style="margin-bottom:10px;">'+
      '<div style="font-size:14px;font-weight:700;margin-bottom:8px;">Run'+(r.week?' · Week '+r.week:'')+'</div>'+
      '<div style="display:flex;gap:16px;margin-bottom:4px;">'+
        '<div><div style="font-size:18px;font-weight:900;letter-spacing:-.5px;">'+dist+'km</div><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;">dist</div></div>'+
        '<div><div style="font-size:18px;font-weight:900;letter-spacing:-.5px;">'+r.time+'</div><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;">time</div></div>'+
        '<div><div style="font-size:18px;font-weight:900;color:var(--accent);letter-spacing:-.5px;">'+p+'/km</div><div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;">pace</div></div>'+
      '</div>'+
      (r.note?'<div style="font-size:12px;color:var(--muted);">'+r.note+'</div>':'')+
    '</div>';
  });
  return html;
}
function renderCalendar(sessions,runs){
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  // build activity map
  var actMap={};
  sessions.forEach(function(s){ actMap[s.date]=(actMap[s.date]||[]); actMap[s.date].push({type:'session',stype:s.type}); });
  runs.forEach(function(r){ actMap[r.date]=(actMap[r.date]||[]); actMap[r.date].push({type:'run'}); });

  var firstDay=new Date(calYear,calMonth,1);
  var daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  // Monday=0 offset
  var startDow=(firstDay.getDay()+6)%7; // 0=Mon

  var header='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'+
    '<button onclick="calNav(-1)" style="background:var(--card2);border:none;border-radius:4px;color:var(--text);width:32px;height:32px;font-size:16px;font-weight:800;cursor:pointer;">‹</button>'+
    '<div style="font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;">'+MONTHS[calMonth]+' '+calYear+'</div>'+
    '<button onclick="calNav(1)" style="background:var(--card2);border:none;border-radius:4px;color:var(--text);width:32px;height:32px;font-size:16px;font-weight:800;cursor:pointer;">›</button>'+
  '</div>';

  var dayHeaders=DAYS.map(function(d){return '<div style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding-bottom:4px;">'+d+'</div>';}).join('');

  var cells='';
  for(var i=0;i<startDow;i++) cells+='<div></div>';
  for(var d=1;d<=daysInMonth;d++){
    var dateStr=calYear+'-'+(calMonth+1<10?'0':'')+(calMonth+1)+'-'+(d<10?'0':'')+d;
    var acts=actMap[dateStr]||[];
    var isSelected=calSelectedDate===dateStr;
    var isToday=dateStr===todayISO();
    var dots='';
    var hasSess=acts.some(function(a){return a.type==='session';});
    var hasRun=acts.some(function(a){return a.type==='run';});
    if(hasSess) dots+='<div style="width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 1px;"></div>';
    if(hasRun)  dots+='<div style="width:5px;height:5px;border-radius:50%;background:var(--orange);margin:0 1px;"></div>';
    cells+='<div class="cal-day" data-date="'+dateStr+'" onclick="selectCalDate(\''+dateStr+'\')" style="'+
      'text-align:center;border-radius:3px;padding:5px 2px;cursor:'+(acts.length?'pointer':'default')+';'+
      'background:'+(isSelected?'var(--accent)':'')+';'+
      'border-bottom:'+(isToday&&!isSelected?'2px solid var(--accent)':'2px solid transparent')+';'+
    '">'+
      '<div style="font-size:12px;font-weight:'+(isToday?'900':'600')+';color:'+(isSelected?'#000':isToday?'var(--accent)':'var(--text)')+';margin-bottom:2px;">'+d+'</div>'+
      '<div style="display:flex;justify-content:center;">'+dots+'</div>'+
    '</div>';
  }

  var grid='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">'+dayHeaders+cells+'</div>';
  var legend='<div style="display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">'+
    '<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;"><div style="width:6px;height:6px;border-radius:50%;background:var(--accent);"></div>Workout</div>'+
    '<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;"><div style="width:6px;height:6px;border-radius:50%;background:var(--orange);"></div>Run</div>'+
  '</div>';
  var detail='<div id="cal-detail" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">'+renderCalDetail(sessions,runs)+'</div>';

  return '<div class="card"><h2>Activity Calendar</h2>'+header+grid+legend+detail+'</div>';
}

function getApiKey(){return localStorage.getItem('kt_apikey')||'';}

function buildIntakeSystemPrompt(){
  return 'You are a world-class personal trainer conducting an intake assessment to build a personalised 12-week training programme.\n\n'+
'Ask the following questions ONE AT A TIME. Wait for an answer before asking the next. Be conversational and encouraging — like a real trainer. Acknowledge each answer briefly before moving to the next question.\n\n'+
'Questions to cover (in this order):\n'+
'1. Main training goals (muscle gain, fat loss, strength, general fitness, sport performance)\n'+
'2. How many gym sessions per week are available\n'+
'3. Do they want a Push/Pull/Legs split or something else (Upper/Lower, Full Body)\n'+
'4. Equipment access — full gym with barbells, cables, dumbbells, machines? Or limited?\n'+
'5. Any injuries, pain points, or exercises to avoid\n'+
'6. Current lifting level — approximate working weights or 1RM estimates for Bench Press, Squat, and Row/Deadlift (or "beginner" if unsure)\n'+
'7. Training experience — how long have they been lifting consistently\n'+
'8. Running/cardio — do they want to include it? If yes, how many days and current ability\n'+
'9. Any exercises they specifically love or hate\n\n'+
'After you have all the answers, say something like "Perfect — building your 12-week programme now..." then output the complete programme as valid JSON wrapped EXACTLY like this:\n\n'+
'ROUTINE_START\n'+
'{"name":"Programme Name","weeks":[...]}\n'+
'ROUTINE_END\n\n'+
'JSON structure for each week object:\n'+
'{"wk":1,"block":1,"bName":"BASE","bColor":"#06b6d4","wkNote":"Brief week focus","push":[...],"pull":[...],"legs":[...],"runTue":{"km":3,"type":"easy","note":"Easy pace"},"runSat":{"km":5,"type":"easy","note":"Long run"}}\n\n'+
'Each exercise: {"name":"Exercise Name","isMain":true,"sets":4,"reps":6,"weight":135,"rpe":7}\n'+
'(isMain only on the primary compound lift per session. weight in lbs. rpe 7-8 for most sets. reps can be a number or string like "8-10")\n\n'+
'Programme structure rules:\n'+
'- Always output all 12 weeks\n'+
'- Each session has 6-7 exercises\n'+
'- Block 1 (weeks 1-4): bName="BASE", bColor="#06b6d4" — establish technique, moderate volume\n'+
'- Block 2 (weeks 5-8): bName="BUILD", bColor="#7c6bff" — increase weight/intensity\n'+
'- Block 3 (weeks 9-11): bName="SPEED", bColor="#f97316" — peak performance, heavier loads\n'+
'- Week 12: bName="DELOAD", bColor="#22c55e" — drop sets to 2-3 and weight by 40%, full recovery\n'+
'- If no running desired, omit runTue and runSat entirely\n'+
'- Set starting weights based on what the user told you; conservative is better than too heavy\n'+
'- Progress weight by ~2.5-5lb per week across the blocks\n'+
'- Use appropriate exercises for their equipment and experience\n'+
'- Start with the first question now.';
}

function startRoutineIntake(){
  intakeMode=true;
  pendingRoutine=null;
  coachMessages=[];
  // Seed the conversation with the opening question
  coachMessages.push({role:'user',content:'I want to generate my training programme.'});
  coachLoading=true;
  render();
  scrollChatBottom();
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':getApiKey(),
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({
      model:'claude-haiku-4-5-20251001',
      max_tokens:512,
      system:buildIntakeSystemPrompt(),
      messages:coachMessages
    })
  }).then(function(res){return res.json();}).then(function(data){
    if(data.content&&data.content[0]){
      coachMessages.push({role:'assistant',content:data.content[0].text});
      checkForRoutineJSON(data.content[0].text);
    }
  }).catch(function(){
    coachMessages.push({role:'assistant',content:'Could not connect. Check your API key and internet connection.'});
  }).finally(function(){
    coachLoading=false;
    render();
    scrollChatBottom();
  });
}

function checkForRoutineJSON(text){
  if(!text) return;
  var start=text.indexOf('ROUTINE_START');
  var end=text.indexOf('ROUTINE_END');
  if(start===-1||end===-1||end<=start) return;
  var jsonStr=text.slice(start+13,end).trim();
  try{
    var obj=JSON.parse(jsonStr);
    if(obj&&Array.isArray(obj.weeks)&&obj.weeks.length>0){
      pendingRoutine=obj;
    }
  }catch(e){ /* bad JSON — ignore */ }
}

function confirmLoadRoutine(){
  if(!pendingRoutine) return;
  setCustomRoutine(pendingRoutine);
  currentWeek=1;
  lsSet('kt_week',1);
  intakeMode=false;
  pendingRoutine=null;
  coachMessages=[];
  showToast('Programme loaded! Week 1 is ready');
  render();
}

function resetCustomRoutine(){
  if(!confirm('Reset your programme? This will remove the current routine. Your logged sessions will be kept.')) return;
  clearCustomRoutine();
  currentWeek=1;
  lsSet('kt_week',1);
  intakeMode=false;
  pendingRoutine=null;
  coachMessages=[];
  render();
  showToast('Programme reset. You can generate a new one anytime.');
}
function setApiKey(k){if(k)localStorage.setItem('kt_apikey',k.trim());else localStorage.removeItem('kt_apikey');}

function saveApiKey(){
  var inp=document.getElementById('coach-key-input');
  if(!inp)return;
  var k=inp.value.trim();
  if(!k||!k.startsWith('sk-')){showToast('Invalid key — must start with sk-');return;}
  setApiKey(k);
  coachMessages=[];
  render();
}

function clearApiKey(){
  if(!confirm('Disconnect API key?'))return;
  setApiKey('');
  coachMessages=[];
  render();
}

function buildSystemPrompt(){
  var wd=getWkData();
  var sessions=getSessions().slice(0,8);
  var runs=getRuns().slice(0,5);
  var prs=getPRs();
  var bws=getBWs();
  var cr=getCustomRoutine();
  var userName=cr&&cr.name?'the user ('+cr.name+')':'the user';
  var p='You are an expert personal trainer and strength coach assistant for '+userName+'. ';
  p+='Give concise, specific, data-driven feedback. Be encouraging but honest. ';
  p+='Keep responses under 150 words unless more detail is explicitly requested. Use actual numbers from their logs.\n\n';
  var totalWks=getTotalWeeks();
  p+='CURRENT WEEK: '+currentWeek+' of '+totalWks+'\n';
  if(wd){
    p+='BLOCK: '+wd.bName+'\n';
    p+='WEEK GOAL: '+wd.wkNote+'\n\n';
    p+='THIS WEEK\'S TARGETS:\n';
    ['push','pull','legs'].forEach(function(sess){
      if(wd[sess]){
        p+=sess.toUpperCase()+':\n';
        wd[sess].forEach(function(ex){p+='  '+ex.name+': '+ex.sets+'x'+ex.reps+' @ '+ex.weight+'lb RPE'+ex.rpe+'\n';});
      }
    });
    p+='\n';
  }
  if(sessions.length){
    p+='RECENT SESSIONS:\n';
    sessions.forEach(function(s){
      p+=s.type+' '+s.date+' (Wk'+s.week+'): ';
      var exStrs=(s.exercises||[]).map(function(ex){
        var r=Array.isArray(ex.reps)?ex.reps.join('/'):ex.reps;
        return ex.name+' '+ex.sets+'x('+r+')@'+(parseFloat(ex.weight)>0?ex.weight+'lb':'BW')+' RPE'+ex.rpe;
      });
      p+=exStrs.join(' | ')+'\n';
    });
    p+='\n';
  }
  if(runs.length){
    p+='RECENT RUNS: '+runs.map(function(r){return (r.distance||r.dist)+'km '+r.time;}).join(', ')+'\n\n';
  }
  var prKeys=Object.keys(prs);
  if(prKeys.length){
    p+='PRs: '+prKeys.map(function(k){return k+' '+prs[k]+'lb';}).join(', ')+'\n';
  }
  if(bws.length){p+='\nBODY WEIGHT: '+bws[0].weight+'lb ('+bws[0].date+')\n';}
  return p;
}

async function sendCoachMessage(){
  var inp=document.getElementById('coach-input');
  if(!inp)return;
  var msg=inp.value.trim();
  if(!msg||coachLoading)return;
  inp.value='';
  inp.style.height='';
  coachMessages.push({role:'user',content:msg});
  coachLoading=true;
  render();
  scrollChatBottom();
  var systemPrompt=intakeMode?buildIntakeSystemPrompt():buildSystemPrompt();
  var maxTok=intakeMode?2048:512;
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':getApiKey(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:maxTok,
        system:systemPrompt,
        messages:coachMessages
      })
    });
    var data=await res.json();
    if(data.content&&data.content[0]){
      var replyText=data.content[0].text;
      coachMessages.push({role:'assistant',content:replyText});
      if(intakeMode) checkForRoutineJSON(replyText);
    }else{
      var errMsg=data.error?data.error.message:'Unknown error. Check your API key.';
      coachMessages.push({role:'assistant',content:' '+errMsg});
    }
  }catch(e){
    coachMessages.push({role:'assistant',content:'Could not connect. Check your internet connection.'});
  }
  coachLoading=false;
  render();
  scrollChatBottom();
}

function sendCoachChip(txt){
  var inp=document.getElementById('coach-input');
  if(inp){inp.value=txt;}
  sendCoachMessage();
}

function scrollChatBottom(){
  setTimeout(function(){
    var screen=document.getElementById('screen');
    if(screen&&currentTab==='coach')screen.scrollTop=screen.scrollHeight;
  },80);
}

function applyTheme(name) {
  var t=THEMES[name]; if(!t) return;
  var r=document.documentElement;
  ['bg','card','card2','border','accent','green','yellow','red','orange','cyan','text','muted','lite'].forEach(function(k){
    r.style.setProperty('--'+k, t[k]);
  });
  localStorage.setItem('kt_theme',name);
  currentTheme=name;
  if(document.getElementById('screen').innerHTML) render();
}

function setAutoTheme(){
  currentTheme='auto';
  localStorage.setItem('kt_theme','auto');
  applyTheme(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  currentTheme='auto';
  render();
}

function saveApiKeyFromSettings(){
  var el=document.getElementById('settingsApiKeyInput');
  if(!el||!el.value.trim()){showToast('Enter a key first');return;}
  setApiKey(el.value.trim());
  showToast('✓ API key saved');
  render();
}
function clearApiKeyFromSettings(){
  setApiKey('');
  showToast('Key removed');
  render();
}

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});

currentTheme = localStorage.getItem('kt_theme') || 'auto';
if(currentTheme==='auto'){
  applyTheme(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  currentTheme='auto';
} else {
  applyTheme(currentTheme);
}
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(e){
    if(currentTheme==='auto') applyTheme(e.matches?'dark':'light');
  });
}catch(ex){}
currentWeek = getWeek();

logSession = (_next === 'Run') ? 'Push' : _next;

render();
