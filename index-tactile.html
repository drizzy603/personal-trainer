<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const amber = '#d4a744';
const cream = '#e8dfc8';
const steel = '#8a7d5c';
const bg = '#1a1612';
const deep = '#0f0d0a';

const StatusBar = () => (
  <div className="status" style={{color:cream}}>
    <span>9:41</span>
    <span style={{display:'flex',gap:5,alignItems:'center'}}>
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none" stroke="currentColor" strokeWidth="1"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5"/><rect x="2" y="2" width="15" height="7" rx="1" fill="currentColor"/><rect x="21.5" y="3.5" width="1.5" height="4" rx=".75" fill="currentColor"/></svg>
    </span>
  </div>
);

const TabBar = ({active,onChange}) => {
  const tabs = ['today','workout','progress','coach','settings'];
  return (
    <div className="tabs">
      {tabs.map(t => (
        <button key={t} className={'tab'+(t===active?' active':'')} onClick={()=>onChange(t)}>{t.slice(0,4)}</button>
      ))}
    </div>
  );
};

// VU-style gauge
const Gauge = ({value, max, label, unit}) => {
  const pct = Math.min(1, value/max);
  const angle = Math.PI*(1-pct);
  return (
    <svg viewBox="0 0 220 130" style={{width:'100%',display:'block'}}>
      <defs>
        <linearGradient id="gg" x1="0" x2="1"><stop offset="0" stopColor={steel}/><stop offset=".75" stopColor={amber}/><stop offset="1" stopColor="#c24a1e"/></linearGradient>
        <radialGradient id="plate" cx=".5" cy=".5"><stop offset="0" stopColor="#3a3228"/><stop offset="1" stopColor="#1a1612"/></radialGradient>
      </defs>
      <path d="M 20 110 A 90 90 0 0 1 200 110" stroke={cream+'18'} strokeWidth="8" fill="none" strokeLinecap="round"/>
      <path d="M 20 110 A 90 90 0 0 1 200 110" stroke="url(#gg)" strokeWidth="8" fill="none" strokeLinecap="round" strokeDasharray={`${pct*283} 283`}/>
      {Array.from({length:21}).map((_,i)=>{
        const a = Math.PI-(i/20)*Math.PI;
        const x1 = 110+Math.cos(a)*78, y1 = 110-Math.sin(a)*78;
        const x2 = 110+Math.cos(a)*(i%5===0?68:72), y2 = 110-Math.sin(a)*(i%5===0?68:72);
        return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={cream+'44'} strokeWidth={i%5===0?1.5:.8}/>;
      })}
      <line x1="110" y1="110" x2={110+Math.cos(angle)*74} y2={110-Math.sin(angle)*74} stroke={amber} strokeWidth="2.5" strokeLinecap="round"/>
      <circle cx="110" cy="110" r="9" fill="url(#plate)" stroke={amber} strokeWidth="1"/>
      <circle cx="110" cy="110" r="2" fill={amber}/>
    </svg>
  );
};

const Knob = ({value, max, label, active}) => (
  <div style={{textAlign:'center'}}>
    <div style={{width:56,height:56,borderRadius:99,background:`radial-gradient(circle at 30% 30%, #4a3f32, #1a1612)`,margin:'0 auto',border:`1px solid ${active?amber:cream+'22'}`,position:'relative',boxShadow:'0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)'}}>
      <div style={{position:'absolute',top:4,left:'50%',width:2,height:12,background:active?amber:steel,transform:`translateX(-50%) rotate(${(value/max)*270-135}deg)`,transformOrigin:'50% 24px'}}/>
      <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:active?amber:cream,letterSpacing:-.5}}>{value}</div>
    </div>
    <div style={{fontSize:8,color:steel,letterSpacing:1.5,marginTop:6,fontWeight:700}}>{label}</div>
  </div>
);

// ———————————————— TODAY ————————————————
const Today = ({onStart}) => (
  <>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10}}>
      <div>
        <div style={{fontSize:9,color:steel,letterSpacing:2.5,fontWeight:700}}>IRON · SER. 0047</div>

      </div>

    {/* Main gauge panel */}
    <div className="panel" style={{padding:'18px 20px 8px',marginBottom:10}}>

        <span>● VOLUME</span>
        <span>LB / WK</span>
      </div>
      <Gauge value={12400} max={16000} label="VOLUME" unit="lb"/>
      <div style={{textAlign:'center',marginTop:-14}}>
        <div className="mono" style={{fontSize:40,fontWeight:700,letterSpacing:-2,lineHeight:1,color:cream}}>12,400</div>
        <div style={{fontSize:9,color:steel,letterSpacing:2,marginTop:4}}>OF 14,500 TARGET</div>
      </div>
      <div style={{height:1,background:cream+'10',margin:'14px 0 10px'}}/>
      <div style={{display:'flex',justifyContent:'space-around'}}>
        <Knob value={3} max={5} label="SESS · 5" active/>
        <Knob value={14} max={30} label="KM · 30" active/>
        <Knob value={7} max={7} label="WK STREAK" active/>
      </div>
    </div>

    {/* Today's session */}
    <div className="panel" style={{padding:'14px 18px',marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:9,color:steel,letterSpacing:2.5,fontWeight:700}}>SESSION · PUSH</div>
        <div style={{fontSize:9,color:steel,letterSpacing:1}}>~45 MIN</div>
      </div>
      <div style={{fontSize:22,fontWeight:700,letterSpacing:-.6,marginBottom:4}}>Bench main · 4 lifts</div>
      {/* Plates visualization */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:2,margin:'10px 0 6px',padding:'10px 0',background:deep,borderRadius:10,border:`1px solid ${cream}10`}}>
        {[['#c24a1e',30,45],[cream,26,45],[steel,18,25]].map(([c,h,w],i)=>(
          <div key={i} style={{width:10,height:h,background:c,borderRadius:1,display:'flex',alignItems:'center',justifyContent:'center',fontSize:7,fontWeight:800,color:'#000',boxShadow:'1px 0 2px rgba(0,0,0,.5)'}}>{w}</div>
        ))}
        <div style={{width:100,height:4,background:`linear-gradient(90deg,${steel},${cream},${steel})`,borderRadius:1}}/>
        {[['#c24a1e',30,45],[cream,26,45],[steel,18,25]].slice().reverse().map(([c,h,w],i)=>(
          <div key={i} style={{width:10,height:h,background:c,borderRadius:1,display:'flex',alignItems:'center',justifyContent:'center',fontSize:7,fontWeight:800,color:'#000',boxShadow:'-1px 0 2px rgba(0,0,0,.5)'}}>{w}</div>
        ))}
      </div>
      <div style={{textAlign:'center',fontSize:9,color:steel,letterSpacing:1.5,marginBottom:10}}>185 LB · 45+25 PER SIDE</div>
    </div>

    {/* Engage button */}
    <button onClick={onStart} className="btn" style={{width:'100%',background:`linear-gradient(180deg,${amber} 0%,#a8792e 100%)`,color:deep,borderRadius:14,padding:'20px 0',fontSize:13,letterSpacing:3,fontWeight:800,boxShadow:`0 4px 0 #7a5820,inset 0 1px 0 rgba(255,255,255,.25)`,textTransform:'uppercase'}}>
      ━━ ENGAGE ━━
    </button>

    <div style={{display:'flex',gap:6,marginTop:10,fontSize:9,color:steel,letterSpacing:1.5}}>
      <span>◀ TUE · PULL · 5,820lb · +PR</span>
    </div>
  </>
);

// ———————————————— WORKOUT ————————————————
const LIFTS = [
  {n:'Bench Press', sets:4, reps:5, w:185, main:true},
  {n:'Overhead Press', sets:3, reps:6, w:115},
  {n:'Incline DB', sets:3, reps:8, w:60},
  {n:'Cable Fly', sets:3, reps:12, w:40},
];

const Workout = ({onClose}) => {
  const [ex, setEx] = React.useState(0);
  const [setN, setSetN] = React.useState(0);
  const [w, setW] = React.useState(LIFTS[0].w);
  const [r, setR] = React.useState(LIFTS[0].reps);
  const [rest, setRest] = React.useState(0);
  const [resting, setResting] = React.useState(false);
  const cur = LIFTS[ex];

  React.useEffect(()=>{
    if(!resting) return;
    const iv = setInterval(()=>setRest(s=>s+1), 1000);
    return ()=>clearInterval(iv);
  },[resting]);

  const done = () => { setResting(true); setRest(0);
    if(setN+1>=cur.sets){
      if(ex+1<LIFTS.length){ setTimeout(()=>{setEx(ex+1);setSetN(0);setW(LIFTS[ex+1].w);setR(LIFTS[ex+1].reps);},300); }
    } else setSetN(setN+1);
  };
  const mm = s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

  return (
    <div style={{position:'absolute',inset:0,background:deep,zIndex:20,display:'flex',flexDirection:'column'}}>
      <div style={{padding:'54px 18px 8px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <button onClick={onClose} className="btn" style={{background:'none',color:steel,fontSize:11,fontWeight:700,letterSpacing:1.5}}>◀ CLOSE</button>
        <div className="mono" style={{fontSize:10,color:steel,letterSpacing:2}}>EX {ex+1}/{LIFTS.length}</div>
        <div style={{fontSize:10,color:steel,letterSpacing:1.5}}>PUSH · WK 7</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'10px 18px 20px'}}>
        {resting && (
          <div className="panel" style={{padding:16,marginBottom:12,textAlign:'center',border:`1px solid ${amber}55`}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:9,letterSpacing:2,color:amber,fontWeight:700,marginBottom:4}}>
              <span>● REST</span><button onClick={()=>{setResting(false);setRest(0);}} className="btn" style={{background:'none',color:steel,fontSize:9,letterSpacing:1.5,fontWeight:700}}>DISMISS ✕</button>
            </div>
            <div className="mono" style={{fontSize:64,fontWeight:700,color:amber,letterSpacing:-3,lineHeight:1}}>{mm(rest)}</div>
            <div style={{fontSize:9,color:steel,letterSpacing:2,marginTop:2}}>TARGET 2:00</div>
            <div style={{height:3,background:amber+'22',borderRadius:2,margin:'12px 0 0'}}>
              <div style={{height:'100%',width:Math.min(100,rest/120*100)+'%',background:amber,transition:'width 1s linear',borderRadius:2}}/>
            </div>
          </div>
        )}
        <div className="panel" style={{padding:20,marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:9,letterSpacing:2.5,color:steel,fontWeight:700,marginBottom:4}}>
            <span>SET {setN+1} / {cur.sets} {cur.main&&<span style={{color:amber,marginLeft:6}}>◆ MAIN</span>}</span>
            <span>RPE 8</span>
          </div>
          <div style={{fontSize:22,fontWeight:700,letterSpacing:-.5,marginBottom:20}}>{cur.n}</div>

          {/* Big dials */}
          <div style={{display:'flex',gap:14,justifyContent:'center',marginBottom:18}}>
            <BigDial label="LB" value={w} onChange={setW} step={5}/>
            <BigDial label="REPS" value={r} onChange={setR} step={1}/>
          </div>

          <button onClick={done} disabled={resting} className="btn" style={{width:'100%',background:resting?'#2a241d':`linear-gradient(180deg,${amber},#a8792e)`,color:resting?steel:deep,borderRadius:12,padding:'18px 0',fontSize:12,fontWeight:800,letterSpacing:2.5,boxShadow:resting?'none':`0 4px 0 #7a5820`,textTransform:'uppercase'}}>
            {resting?'━ RESTING ━':'━ LOG SET ✓ ━'}
          </button>

          <div style={{display:'flex',gap:6,justifyContent:'center',marginTop:14}}>
            {Array.from({length:cur.sets}).map((_,i)=>(
              <div key={i} style={{width:22,height:22,borderRadius:6,background:i<setN?amber:'transparent',color:i<setN?deep:i===setN?amber:steel,border:`1.5px solid ${i===setN?amber:cream+'20'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:800}}>{i<setN?'✓':i+1}</div>
            ))}
          </div>
        </div>

        <div style={{fontSize:9,color:steel,letterSpacing:2,fontWeight:700,padding:'6px 4px'}}>UP NEXT</div>
        {LIFTS.slice(ex+1).map((l,i)=>(
          <div key={i} className="panel" style={{padding:'12px 14px',marginBottom:5,display:'flex',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:13,fontWeight:600}}>{l.n}</div>
              <div style={{fontSize:10,color:steel,marginTop:2,letterSpacing:.5}}>{l.sets}×{l.reps} · {l.w} lb</div>
            </div>
            <div style={{color:steel}}>›</div>
          </div>
        ))}
      </div>
    </div>
  );
};

const BigDial = ({label,value,onChange,step}) => (
  <div style={{flex:1,textAlign:'center'}}>
    <div style={{fontSize:8,letterSpacing:2,color:steel,fontWeight:700,marginBottom:4}}>{label}</div>
    <div style={{background:deep,borderRadius:14,padding:'10px 6px',border:`1px solid ${cream}12`,boxShadow:'inset 0 2px 4px rgba(0,0,0,.5)'}}>
      <div className="mono" style={{fontSize:40,fontWeight:700,letterSpacing:-2,color:cream,lineHeight:1}}>{value}</div>
    </div>
    <div style={{display:'flex',gap:4,marginTop:6}}>
      <button onClick={()=>onChange(Math.max(0,value-step))} className="btn" style={{flex:1,background:'#2a241d',color:cream,borderRadius:8,padding:'8px 0',fontSize:16,fontWeight:700,border:`1px solid ${cream}12`}}>−</button>
      <button onClick={()=>onChange(value+step)} className="btn" style={{flex:1,background:'#2a241d',color:cream,borderRadius:8,padding:'8px 0',fontSize:16,fontWeight:700,border:`1px solid ${cream}12`}}>+</button>
    </div>
  </div>
);

// ———————————————— PROGRESS ————————————————
const Progress = () => (
  <>
    <div style={{marginBottom:10}}>

              <div style={{position:'absolute',inset:0,width:'82%',background:`linear-gradient(90deg,${c}77,${c})`,borderRadius:3}}/>
              {[.2,.4,.6,.8].map(p=><div key={p} style={{position:'absolute',left:`${p*100}%`,top:0,bottom:0,width:1,background:deep}}/>)}
            </div>
            <span className="mono" style={{fontSize:11,fontWeight:700,width:40,textAlign:'right',color:c}}>{e}</span>
          </div>
        </div>
      ))}
    </div>

    <div className="panel" style={{padding:'14px 16px',marginBottom:10}}>
      <div style={{fontSize:9,color:steel,letterSpacing:2,fontWeight:700,marginBottom:10}}>12 WK · LOG</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(12, 1fr)',gap:2}}>
        {Array.from({length:84}).map((_,i)=>{
          const v = [0,.3,0,.6,0,.3,.9,0,.6,.3,0,.9,0,.3,.6,0,.9,0,.3,0][i%20];
          return <div key={i} style={{aspectRatio:1,background:v===0?deep:amber,opacity:v===0?1:.3+v*.7,borderRadius:2,border:v===0?`1px solid ${cream}08`:'none'}}/>;
        })}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:steel,letterSpacing:1,marginTop:8}}>
        <span>W1</span><span>24 SESSIONS</span><span>W12</span>
      </div>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'repeat(3, 1fr)',gap:6}}>
      {[['STREAK','7','wk'],['VOL','184k','lb'],['PR','3','◆']].map(([k,v,u])=>(
        <div key={k} className="panel" style={{padding:'12px 8px',textAlign:'center'}}>
          <div style={{fontSize:8,letterSpacing:1.5,color:steel,fontWeight:700}}>{k}</div>
          <div className="mono" style={{fontSize:20,fontWeight:700,letterSpacing:-1,marginTop:2,color:amber}}>{v}</div>
          <div style={{fontSize:9,color:steel,letterSpacing:1}}>{u}</div>
        </div>
      ))}
    </div>
  </>
);

// ———————————————— COACH ————————————————
const Coach = () => {
  const [msgs,setMsgs] = React.useState([
    {r:'u',t:'shoulder feels tight today'},
    {r:'a',t:'Understood. Swap bench → landmine press. Same push stimulus, less AC joint load. Sound good?'},
  ]);
  const [v,setV] = React.useState('');
  const send = t => { if(!t.trim()) return; setMsgs(m=>[...m,{r:'u',t}]); setV(''); setTimeout(()=>setMsgs(m=>[...m,{r:'a',t:"Updated. I'll monitor RPE and reassess next week."}]),600); };
  return (
    <>
      <div style={{marginBottom:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:9,color:steel,letterSpacing:2.5,fontWeight:700}}>CONSOLE</div>
          <div style={{fontSize:24,fontWeight:700,letterSpacing:-.8,marginTop:2}}>Coach</div>
        </div>
        <div style={{fontSize:9,color:amber,letterSpacing:1.5}}>● LIVE</div>
      </div>

      <div className="panel" style={{padding:12,marginBottom:10}}>
        <div style={{fontSize:9,color:steel,letterSpacing:2,fontWeight:700,marginBottom:6}}>● LIVE CONTEXT</div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          {['WK 7·PEAK','BENCH+25','STREAK 7','SLEEP 6.5H'].map(c=>(
            <div key={c} style={{fontSize:9,fontWeight:700,padding:'4px 9px',borderRadius:6,background:deep,color:amber,border:`1px solid ${amber}33`,letterSpacing:1}}>{c}</div>
          ))}
        </div>
      </div>

      <div className="panel" style={{padding:14,marginBottom:10,border:`1px solid ${amber}44`}}>
        <div style={{fontSize:9,letterSpacing:2,color:amber,fontWeight:700,marginBottom:6}}>▶ PRE-SESSION BRIEF</div>
        <div style={{fontSize:13,lineHeight:1.5}}><b>Focus:</b> bench 185×5 × 4. Stay RPE 8. <b>Don't:</b> chase volume after.</div>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:10}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{alignSelf:m.r==='u'?'flex-end':'flex-start',maxWidth:'82%',background:m.r==='u'?amber:'transparent',color:m.r==='u'?deep:cream,border:m.r==='u'?'none':`1px solid ${cream}15`,padding:'10px 13px',borderRadius:10,fontSize:13,lineHeight:1.45,fontWeight:m.r==='u'?500:400}}>{m.t}</div>
        ))}
      </div>

      <div style={{display:'flex',gap:5,background:deep,borderRadius:12,padding:'5px 5px 5px 12px',border:`1px solid ${cream}15`}}>
        <input value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send(v)} placeholder="Transmit…" style={{flex:1,background:'transparent',border:'none',outline:'none',color:cream,fontSize:13,fontFamily:'inherit'}}/>
        <button onClick={()=>send(v)} className="btn" style={{width:30,height:30,borderRadius:8,background:amber,color:deep,fontWeight:700}}>↑</button>
      </div>
      <div style={{display:'flex',gap:5,marginTop:8,overflowX:'auto'}}>
        {['Plan tomorrow','Why stalled?','Form'].map(c=>(
          <button key={c} onClick={()=>send(c)} className="btn" style={{fontSize:10,padding:'6px 10px',borderRadius:99,background:'#2a241d',border:`1px solid ${cream}15`,color:steel,whiteSpace:'nowrap',letterSpacing:.5}}>{c}</button>
        ))}
      </div>
    </>
  );
};

// ———————————————— SETTINGS ————————————————
const Settings = () => (
  <>
    <div style={{marginBottom:10}}>
      <div style={{fontSize:9,color:steel,letterSpacing:2.5,fontWeight:700}}>CONFIG</div>
      <div style={{fontSize:24,fontWeight:700,letterSpacing:-.8,marginTop:2}}>Settings</div>
    </div>

    <div className="panel" style={{padding:14,marginBottom:10,display:'flex',gap:12,alignItems:'center'}}>
      <div style={{width:44,height:44,borderRadius:8,background:`linear-gradient(135deg,${amber},#a8792e)`,color:deep,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:18,boxShadow:'inset 0 1px 0 rgba(255,255,255,.2)'}}>K</div>
      <div>
        <div style={{fontSize:14,fontWeight:600}}>Kalani</div>
        <div style={{fontSize:10,color:steel,letterSpacing:1.5}}>SER. 0047 · PEAK WK 7</div>
      </div>
    </div>

    <div style={{fontSize:9,color:steel,letterSpacing:2,fontWeight:700,padding:'4px 4px 6px'}}>APPEARANCE</div>
    <div className="panel" style={{padding:14,marginBottom:10}}>
      <div style={{fontSize:11,color:cream,marginBottom:8,letterSpacing:.5}}>Accent</div>
      <div style={{display:'flex',gap:8}}>
        {['#d4a744','#c24a1e','#8a7d5c','#e8dfc8','#5a7a3a'].map((c,i)=>(
          <div key={c} style={{width:40,height:40,borderRadius:99,background:`radial-gradient(circle at 30% 30%, ${c}ee, ${c}aa)`,border:i===0?`3px solid ${cream}`:`3px solid transparent`,boxShadow:i===0?`0 0 0 2px ${c}`:'inset 0 1px 0 rgba(255,255,255,.2)',cursor:'pointer'}}/>
        ))}
      </div>
      <div style={{fontSize:10,color:steel,marginTop:8,letterSpacing:.5}}>Dials and bezels recolor to match.</div>
    </div>

    <div style={{fontSize:9,color:steel,letterSpacing:2,fontWeight:700,padding:'4px 4px 6px'}}>INSTRUMENT</div>
    {['Units · lb / km','Rest default · 2:00','Week start · Mon','Coach · Sonnet','Haptics · ON','Plate math','How it works','Export'].map((l,i)=>(
      <div key={l} className="panel" style={{padding:'13px 14px',marginBottom:4,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:13,fontWeight:500}}>{l.split(' · ')[0]}</span>
        <span style={{fontSize:11,color:steel,letterSpacing:.5}}>{l.split(' · ')[1]||'›'}</span>
      </div>
    ))}
  </>
);

// ———————————————— APP ————————————————
const App = () => {
  const [tab,setTab] = React.useState('today');
  const [workout,setWorkout] = React.useState(false);
  let body;
  if(tab==='today') body = <Today onStart={()=>setWorkout(true)}/>;
  else if(tab==='workout') body = <Today onStart={()=>setWorkout(true)}/>;
  else if(tab==='progress') body = <Progress/>;
  else if(tab==='coach') body = <Coach/>;
  else body = <Settings/>;
  return (
    <>
      <div className="phone">
        <StatusBar/>
        <div className="screen">{body}</div>
        <TabBar active={tab==='workout'?'today':tab} onChange={t=>{if(t==='workout'){setWorkout(true);}else setTab(t);}}/>
        {workout && <Workout onClose={()=>setWorkout(false)}/>}
      </div>
      <div className="caption">
        <b style={{color:amber}}>03 · The Instrument</b><br/>
        Machined aluminum. Analog gauges. Weighted controls. Tap <b>Engage</b> to start a session, or tab through Progress / Coach / Settings. <a href="index-previews.html" style={{color:amber,textDecoration:'none'}}>← all four</a>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
