<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Trainer — Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"/>
<style>
  html,body{margin:0;background:#000;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;}
  #root{display:flex;gap:40px;align-items:center;}
  .phone{width:390px;height:800px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 40px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06) inset;background:#000;color:#fff;font-size:14px;}
  .phone *{box-sizing:border-box;}
  .status{position:absolute;top:0;left:0;right:0;height:44px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:600;z-index:20;pointer-events:none;color:#fff;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .caption{color:#555;font-size:13px;max-width:260px;line-height:1.5;}
  .btn{font-family:inherit;cursor:pointer;border:none;}
  input{font-family:inherit;}
  .nav{position:absolute;bottom:14px;left:16px;right:16px;display:flex;justify-content:space-around;background:rgba(15,15,15,.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:6px;z-index:15;}
  .ntab{flex:1;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#555;border-radius:14px;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;letter-spacing:.5px;}
  .ntab.active{background:#1a1a1a;color:#fff;}
  @keyframes arrowUp{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
  .arrowhint{animation:arrowUp 1.5s ease-in-out infinite;}

  body{padding-top:56px !important;} /*PREVIEW-BANNER-PAD*/
</style>
</head>
<body>
<div id="preview-banner" style="position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(10,10,14,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 12px/1.2 -apple-system,system-ui,sans-serif;color:#9ca3af;"><span><b style="color:#c8ff00;">PREVIEW</b> · Cards design</span><span style="display:flex;gap:10px;"><a href="index-previews.html" style="color:#9ca3af;text-decoration:none;font-weight:600;padding:4px 10px;border:1px solid rgba(255,255,255,.15);border-radius:999px;">All previews</a><a href="./" style="color:#c8ff00;text-decoration:none;font-weight:600;padding:4px 10px;border:1px solid rgba(200,255,0,.3);border-radius:999px;">← Main app</a></span></div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const crimson = '#ff3355';
const dim = '#555';

const StatusBar = () => (
  <div className="status">
    <span>9:41</span>
    <span style={{display:'flex',gap:5,alignItems:'center'}}>
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="6" width="3" height="5" rx="1"/><rect x="4.5" y="4" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none" stroke="currentColor" strokeWidth="1"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5"/><rect x="2" y="2" width="15" height="7" rx="1" fill="currentColor"/><rect x="21.5" y="3.5" width="1.5" height="4" rx=".75" fill="currentColor"/></svg>
    </span>
  </div>
);

const TabBar = ({active,onChange}) => {
  const tabs = [['today','⌂'],['progress','↗'],['coach','◉'],['settings','⚙']];
  return (
    <div className="nav">
      {tabs.map(([t,g])=>(
        <button key={t} onClick={()=>onChange(t)} className={'ntab'+(t===active?' active':'')}>
          <span style={{fontSize:14,lineHeight:1}}>{g}</span><span style={{textTransform:'uppercase'}}>{t}</span>
        </button>
      ))}
    </div>
  );
};

const EXERCISES = [
  {n:'Bench Press',sets:4,reps:5,w:185,c:crimson,prev:'180×5',main:true},
  {n:'Overhead Press',sets:3,reps:6,w:115,c:'#3d5afe',prev:'110×6'},
  {n:'Incline DB',sets:3,reps:8,w:60,c:'#ffab00',prev:'55×8'},
  {n:'Cable Fly',sets:3,reps:12,w:40,c:'#00e5a0',prev:'35×12'},
];

// ———————— TODAY (stack of cards, swipeable) ————————
const Today = ({onTab}) => {
  const [idx,setIdx] = React.useState(0);
  const [dy,setDy] = React.useState(0);
  const [engaged,setEngaged] = React.useState(false);
  const [setN,setSetN] = React.useState(0);
  const [resting,setResting] = React.useState(false);
  const [restSec,setRestSec] = React.useState(0);
  const startY = React.useRef(null);
  const cur = EXERCISES[idx];

  React.useEffect(()=>{
    if(!resting) return;
    const iv = setInterval(()=>setRestSec(s=>s+1),1000);
    return ()=>clearInterval(iv);
  },[resting]);

  const onDown = e => { startY.current = (e.touches?.[0]?.clientY) ?? e.clientY; };
  const onMove = e => {
    if(startY.current==null) return;
    const y = (e.touches?.[0]?.clientY) ?? e.clientY;
    setDy(y - startY.current);
  };
  const onUp = () => {
    if(dy < -80 && idx < EXERCISES.length-1){ setIdx(i=>i+1); setSetN(0); }
    else if(dy > 80 && idx > 0){ setIdx(i=>i-1); setSetN(0); }
    setDy(0); startY.current = null;
  };

  const tap = () => {
    if(resting){ setResting(false); setRestSec(0); return; }
    if(!engaged){ setEngaged(true); return; }
    // complete set
    setResting(true); setRestSec(0);
    if(setN+1 >= cur.sets){
      setEngaged(false);
      setTimeout(()=>{
        if(idx+1<EXERCISES.length){ setIdx(idx+1); setSetN(0); }
      },400);
    } else setSetN(setN+1);
  };

  const dragOff = dy;
  const next = EXERCISES[idx+1];
  const prev = EXERCISES[idx-1];

  return (
    <>
      {/* Top meta */}
      <div style={{position:'absolute',top:52,left:20,right:20,zIndex:16,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5}}>PUSH · THU</div>
          <div style={{fontSize:15,fontWeight:700,letterSpacing:-.3,marginTop:2}}>{idx+1} of {EXERCISES.length}</div>
        </div>
        <div className="mono" style={{fontSize:10,color:dim,letterSpacing:1.5}}>{Math.round((idx/EXERCISES.length)*100)}%</div>
      </div>
      <div style={{position:'absolute',top:96,left:20,right:20,height:3,background:'#1a1a1a',borderRadius:2,zIndex:16,display:'flex',gap:3}}>
        {EXERCISES.map((e,i)=>(
          <div key={i} style={{flex:1,height:'100%',background:i<idx?crimson:i===idx?'rgba(255,255,255,.4)':'#1a1a1a',borderRadius:2}}/>
        ))}
      </div>

      {/* Card stack area */}
      <div onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp} onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp} style={{position:'absolute',top:120,left:20,right:20,bottom:80,userSelect:'none'}}>
        {/* PREV ghost */}
        {prev && dragOff > 20 && (
          <div style={{position:'absolute',inset:0,background:'#0a0a0a',border:'1px solid rgba(255,255,255,.06)',borderRadius:28,padding:28,transform:`translateY(${-40 + dragOff*.3}px) scale(.96)`,opacity:Math.min(1,dragOff/100),zIndex:5}}>
            <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5,marginBottom:4}}>◀ PREVIOUS · {String(idx).padStart(2,'0')}</div>
            <div style={{fontSize:22,fontWeight:700,color:'#aaa',letterSpacing:-.5}}>{prev.n}</div>
          </div>
        )}

        {/* NEXT ghost */}
        {next && (
          <div style={{position:'absolute',inset:0,background:'#0a0a0a',border:'1px solid rgba(255,255,255,.06)',borderRadius:28,padding:28,transform:`translateY(${14 + (dragOff < 0 ? dragOff*.3 : 0)}px) scale(${.96 + (dragOff < 0 ? Math.min(.04,-dragOff/2000) : 0)})`,zIndex:8}}>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5}}>NEXT · {String(idx+2).padStart(2,'0')}</div>
              <div style={{fontSize:10,color:dim}}>{next.sets}×{next.reps}</div>
            </div>
            <div style={{marginTop:'auto',position:'absolute',bottom:28,left:28,right:28}}>
              <div style={{fontSize:22,fontWeight:700,color:'#888',letterSpacing:-.5}}>{next.n}</div>
              <div style={{fontSize:13,color:'#444',marginTop:4}}>{next.w} lb</div>
            </div>
          </div>
        )}

        {/* CURRENT card */}
        <div onClick={tap} style={{position:'absolute',inset:0,background:engaged?'#111':cur.c,borderRadius:28,padding:28,display:'flex',flexDirection:'column',boxShadow:engaged?`0 0 0 2px ${cur.c}, 0 20px 40px rgba(0,0,0,.6)`:`0 20px 40px ${cur.c}55`,transform:`translateY(${dragOff}px) rotate(${dragOff*.02}deg)`,transition:startY.current==null?'all .25s cubic-bezier(.2,.9,.2,1)':'none',zIndex:10,cursor:'pointer',color:engaged?'#fff':'#000'}}>
          {!engaged ? (
            <>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{fontSize:72,fontWeight:900,lineHeight:1,letterSpacing:-4,opacity:.12}}>{String(idx+1).padStart(2,'0')}</div>
                <div style={{display:'flex',flexDirection:'column',gap:4,alignItems:'flex-end'}}>
                  <div style={{fontSize:11,fontWeight:800,letterSpacing:1.5,background:'rgba(0,0,0,.15)',padding:'6px 12px',borderRadius:99}}>{cur.sets}×{cur.reps} · RPE 8</div>
                  {cur.main && <div style={{fontSize:10,fontWeight:700,letterSpacing:2,color:'#000',opacity:.7}}>◆ MAIN LIFT</div>}
                </div>
              </div>

              <div style={{marginTop:'auto'}}>
                <div style={{fontSize:12,fontWeight:700,opacity:.7,letterSpacing:1,marginBottom:6}}>LAST TIME · {cur.prev}</div>
                <div style={{fontSize:34,fontWeight:800,letterSpacing:-1.3,lineHeight:1.05,marginBottom:8}}>{cur.n}</div>
                <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:26}}>
                  <div style={{fontSize:84,fontWeight:900,letterSpacing:-5,lineHeight:.95}}>{cur.w}</div>
                  <div style={{fontSize:20,fontWeight:700,opacity:.7}}>lb</div>
                </div>
                <div style={{background:'#000',color:'#fff',borderRadius:20,padding:'18px 0',fontSize:15,fontWeight:800,textAlign:'center',letterSpacing:.3}}>
                  Tap to engage  ▸
                </div>
              </div>
            </>
          ) : (
            <>
              {/* ENGAGED state */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontSize:10,color:cur.c,fontWeight:800,letterSpacing:1.5}}>◉ LIVE · {cur.n.toUpperCase()}</div>
                  <div style={{fontSize:13,color:dim,marginTop:2,fontWeight:600}}>SET {setN+1} OF {cur.sets}</div>
                </div>
                <div style={{display:'flex',gap:4}}>
                  {Array.from({length:cur.sets}).map((_,i)=>(
                    <div key={i} style={{width:18,height:18,borderRadius:5,background:i<setN?cur.c:'transparent',border:`1.5px solid ${i<=setN?cur.c:'#333'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:800,color:'#000'}}>{i<setN?'✓':''}</div>
                  ))}
                </div>
              </div>

              {resting ? (
                <div style={{margin:'auto 0',textAlign:'center'}}>
                  <div style={{fontSize:10,color:cur.c,fontWeight:800,letterSpacing:2,marginBottom:8}}>● REST</div>
                  <div className="mono" style={{fontSize:96,fontWeight:700,color:cur.c,letterSpacing:-5,lineHeight:1}}>{Math.floor(restSec/60)}:{String(restSec%60).padStart(2,'0')}</div>
                  <div style={{fontSize:11,color:dim,letterSpacing:2,marginTop:4}}>OF 2:00 · TAP TO SKIP</div>
                  <div style={{height:4,background:'#1a1a1a',borderRadius:2,margin:'24px 32px 0'}}>
                    <div style={{height:'100%',width:Math.min(100,restSec/120*100)+'%',background:cur.c,borderRadius:2,transition:'width 1s linear'}}/>
                  </div>
                </div>
              ) : (
                <>
                  <div style={{margin:'auto 0'}}>
                    <div style={{display:'flex',alignItems:'baseline',gap:10,justifyContent:'center'}}>
                      <div style={{fontSize:120,fontWeight:900,letterSpacing:-6,lineHeight:.9}}>{cur.w}</div>
                      <div style={{fontSize:22,color:dim,fontWeight:700}}>× {cur.reps}</div>
                    </div>
                    <div style={{textAlign:'center',fontSize:12,color:dim,letterSpacing:1,marginTop:4,fontWeight:600}}>TAP WHEN DONE</div>
                  </div>
                  <div style={{display:'flex',gap:8,justifyContent:'center'}}>
                    {[-5,-1,'+1','+5'].map(s=>(
                      <button key={s} className="btn" style={{padding:'10px 14px',borderRadius:12,background:'#1a1a1a',color:'#fff',fontSize:12,fontWeight:700,border:'1px solid #333'}}>{s}</button>
                    ))}
                  </div>
                </>
              )}
            </>
          )}
        </div>
      </div>

      {/* Swipe hint */}
      {!engaged && (
        <div className="arrowhint" style={{position:'absolute',bottom:86,left:0,right:0,textAlign:'center',color:dim,fontSize:10,letterSpacing:2,fontWeight:700,zIndex:16,pointerEvents:'none'}}>
          <div style={{fontSize:14,marginBottom:2}}>⌃</div>
          SWIPE UP TO SKIP
        </div>
      )}
    </>
  );
};

// ———————— PROGRESS ————————
const Progress = () => {
  const cards = [
    {l:'BENCH',v:'205',d:'+25 lb',c:crimson,bars:[.4,.5,.6,.7,.8,.9,1]},
    {l:'SQUAT',v:'275',d:'+25 lb',c:'#3d5afe',bars:[.5,.6,.65,.75,.85,.9,1]},
    {l:'PULL-UP',v:'BW+25',d:'PR',c:'#ffab00',bars:[.2,.4,.55,.7,.85,.95,1]},
    {l:'VOL',v:'184k',d:'+12% wk',c:'#00e5a0',bars:[.3,.55,.4,.7,.65,.85,1]},
  ];
  return (
    <div style={{position:'absolute',inset:0,overflowY:'auto',padding:'52px 20px 90px',scrollbarWidth:'none'}}>
      <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5,marginBottom:4}}>WK 7 OF 12 · PEAK</div>
      <div style={{fontSize:32,fontWeight:800,letterSpacing:-1.5,marginBottom:24}}>Seven weeks in.</div>

      {/* Swipeable big card */}
      <div style={{display:'flex',gap:12,overflowX:'auto',marginLeft:-20,marginRight:-20,padding:'0 20px 4px',scrollbarWidth:'none',scrollSnapType:'x mandatory'}}>
        {cards.map(c=>(
          <div key={c.l} style={{flexShrink:0,width:260,background:c.c,color:'#000',borderRadius:24,padding:24,scrollSnapAlign:'start'}}>
            <div style={{fontSize:10,fontWeight:800,letterSpacing:2,opacity:.65}}>{c.l}</div>
            <div style={{fontSize:52,fontWeight:900,letterSpacing:-2.5,lineHeight:1,marginTop:4}}>{c.v}</div>
            <div style={{fontSize:13,fontWeight:700,marginTop:4,opacity:.7}}>{c.d}</div>
            <div style={{display:'flex',alignItems:'flex-end',gap:3,height:60,marginTop:18}}>
              {c.bars.map((h,i)=><div key={i} style={{flex:1,height:`${h*100}%`,background:'#000',opacity:.15+h*.85,borderRadius:3}}/>)}
            </div>
            <div style={{fontSize:9,marginTop:6,opacity:.5,letterSpacing:1}}>W1 · · · · · · W7</div>
          </div>
        ))}
      </div>

      <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5,margin:'24px 0 10px'}}>ACTIVITY</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(12,1fr)',gap:3}}>
        {Array.from({length:84}).map((_,i)=>{
          const v = [0,.3,0,.6,0,.3,.9,0,.6,.3,0,.9,0,.3,.6,0,.9,0,.3,0][i%20];
          return <div key={i} style={{aspectRatio:1,background:v===0?'#111':crimson,opacity:v===0?1:.3+v*.7,borderRadius:3}}/>;
        })}
      </div>
      <div style={{fontSize:10,color:dim,letterSpacing:1,marginTop:8,display:'flex',justifyContent:'space-between'}}><span>12 WEEKS</span><span>24 SESSIONS · 7 STREAK</span></div>
    </div>
  );
};

// ———————— COACH (card-based chat) ————————
const Coach = () => {
  const [msgs,setMsgs] = React.useState([
    {r:'a',t:"Your week so far — you're ahead on strength, behind on cardio."},
    {r:'a',t:"Want me to swap tomorrow to a run?"},
  ]);
  const [v,setV] = React.useState('');
  const send = t => { if(!t.trim()) return; setMsgs(m=>[...m,{r:'u',t}]); setV(''); setTimeout(()=>setMsgs(m=>[...m,{r:'a',t:"Done. I'll set it for 30 min @ Z2."}]),600); };
  return (
    <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column'}}>
      <div style={{padding:'52px 20px 10px',display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:32,height:32,borderRadius:99,background:crimson,color:'#000',fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14}}>C</div>
        <div>
          <div style={{fontSize:15,fontWeight:700}}>Coach</div>
          <div style={{fontSize:10,color:dim,letterSpacing:.3}}>● live</div>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'8px 20px 10px',display:'flex',flexDirection:'column',gap:8,scrollbarWidth:'none'}}>
        {/* Dashboard card */}
        <div style={{background:'#111',border:'1px solid rgba(255,255,255,.06)',borderRadius:18,padding:14}}>
          <div style={{fontSize:9,color:dim,letterSpacing:.5,fontWeight:700,marginBottom:10}}>THIS WEEK</div>
          <div style={{display:'flex',gap:10}}>
            {[['LIFT','86%',crimson],['SESS','60%','#3d5afe'],['CARDIO','47%','#ffab00']].map(([l,v,c])=>(
              <div key={l} style={{flex:1}}>
                <div style={{fontSize:9,color:c,fontWeight:700}}>{l}</div>
                <div style={{fontSize:18,fontWeight:800,marginTop:2,letterSpacing:-.5}}>{v}</div>
                <div style={{height:3,background:'rgba(255,255,255,.08)',borderRadius:2,marginTop:4}}>
                  <div style={{height:'100%',background:c,width:v,borderRadius:2}}/>
                </div>
              </div>
            ))}
          </div>
        </div>

        {msgs.map((m,i)=>(
          <div key={i} style={{alignSelf:m.r==='u'?'flex-end':'flex-start',maxWidth:'82%',background:m.r==='u'?crimson:'#111',color:m.r==='u'?'#000':'#fff',border:m.r==='u'?'none':'1px solid rgba(255,255,255,.06)',padding:'10px 13px',borderRadius:m.r==='u'?'16px 16px 4px 16px':'16px 16px 16px 4px',fontSize:13,lineHeight:1.5,fontWeight:m.r==='u'?600:400}}>{m.t}</div>
        ))}
      </div>

      <div style={{padding:'6px 16px 76px'}}>
        <div style={{display:'flex',gap:5,overflowX:'auto',marginBottom:6,paddingBottom:2,scrollbarWidth:'none'}}>
          {['Swap to run','Why?','Plan tomorrow'].map(c=>(
            <button key={c} onClick={()=>send(c)} className="btn" style={{fontSize:11,padding:'6px 11px',borderRadius:99,background:'#111',border:'1px solid rgba(255,255,255,.06)',color:'#9ca3af',whiteSpace:'nowrap',flexShrink:0}}>{c}</button>
          ))}
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center',background:'#111',border:'1px solid rgba(255,255,255,.06)',borderRadius:22,padding:'5px 5px 5px 14px'}}>
          <input value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send(v)} placeholder="Ask coach…" style={{flex:1,background:'transparent',border:'none',outline:'none',color:'#fff',fontSize:13}}/>
          <button onClick={()=>send(v)} className="btn" style={{width:32,height:32,borderRadius:99,background:crimson,color:'#000',fontWeight:700}}>↑</button>
        </div>
      </div>
    </div>
  );
};

// ———————— SETTINGS ————————
const Settings = () => (
  <div style={{position:'absolute',inset:0,overflowY:'auto',padding:'52px 20px 90px',scrollbarWidth:'none'}}>
    <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5,marginBottom:4}}>ACCOUNT</div>
    <div style={{fontSize:32,fontWeight:800,letterSpacing:-1.5,marginBottom:16}}>Settings</div>

    <div style={{background:crimson,color:'#000',borderRadius:20,padding:18,marginBottom:12,display:'flex',gap:12,alignItems:'center'}}>
      <div style={{width:44,height:44,borderRadius:12,background:'#000',color:crimson,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:18}}>K</div>
      <div><div style={{fontSize:15,fontWeight:800}}>Kalani</div><div style={{fontSize:11,fontWeight:700,opacity:.7}}>PEAK · WK 7</div></div>
    </div>

    <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5,padding:'12px 4px 8px'}}>APPEARANCE</div>
    <div style={{background:'#111',border:'1px solid rgba(255,255,255,.06)',borderRadius:16,padding:16,marginBottom:6}}>
      <div style={{fontSize:11,marginBottom:10,fontWeight:500}}>Primary accent</div>
      <div style={{display:'flex',gap:8}}>
        {['#ff3355','#3d5afe','#ffab00','#00e5a0','#c8ff00'].map((c,i)=>(
          <div key={c} style={{flex:1,height:50,borderRadius:12,background:c,border:i===0?'3px solid #fff':'3px solid transparent',boxShadow:i===0?`0 0 0 2px ${c}`:'none',cursor:'pointer'}}/>
        ))}
      </div>
      <div style={{fontSize:10,color:dim,marginTop:8}}>Affects current-exercise card. Secondary colors stay fixed per-exercise.</div>
    </div>

    <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5,padding:'12px 4px 8px'}}>GESTURES</div>
    {[['Swipe up','Skip to next exercise'],['Swipe down','Previous exercise'],['Tap card','Engage / log set'],['Double tap','Fail set'],['Long press','Exercise notes']].map(([l,r])=>(
      <div key={l} style={{background:'#111',border:'1px solid rgba(255,255,255,.06)',borderRadius:12,padding:'12px 14px',marginBottom:4,display:'flex',justifyContent:'space-between'}}>
        <span style={{fontSize:13,fontWeight:600}}>{l}</span>
        <span style={{fontSize:11,color:dim}}>{r}</span>
      </div>
    ))}

    <div style={{fontSize:10,color:dim,fontWeight:700,letterSpacing:1.5,padding:'12px 4px 8px'}}>MORE</div>
    {['Rest default — 2:00','Units — lb / km','Haptics','Export','How it works'].map(l => (
      <div key={l} style={{background:'#111',border:'1px solid rgba(255,255,255,.06)',borderRadius:12,padding:'13px 14px',marginBottom:4,display:'flex',justifyContent:'space-between'}}>
        <span style={{fontSize:13,fontWeight:500}}>{l.split(' — ')[0]}</span>
        <span style={{fontSize:11,color:dim}}>{l.split(' — ')[1]||'›'}</span>
      </div>
    ))}
  </div>
);

// ———————— APP ————————
const App = () => {
  const [tab,setTab] = React.useState('today');
  return (
    <>
      <div className="phone">
        <StatusBar/>
        {tab==='today' && <Today onTab={setTab}/>}
        {tab==='progress' && <Progress/>}
        {tab==='coach' && <Coach/>}
        {tab==='settings' && <Settings/>}
        <TabBar active={tab} onChange={setTab}/>
      </div>
      <div className="caption">
        <b style={{color:crimson}}>05 · The Deck</b><br/>
        One thumb. Tap the card to engage → weight & reps fill the screen. Tap again when done, rest auto-starts. <b>Swipe up</b> to skip, <b>down</b> for previous. Each exercise has its own color. <a href="index-previews.html" style={{color:crimson,textDecoration:'none'}}>← all four</a>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
