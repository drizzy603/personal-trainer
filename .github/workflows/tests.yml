name: Web regression tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - 'ios/App/FPKit/Sources/FPStore/Resources/ktstore.js'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'ios/App/FPKit/Sources/FPStore/Resources/ktstore.js'
  workflow_dispatch:

jobs:
  # Two separate jobs, each inside its own 15 minutes: the classic run (the browser, the PWA and every shell
  # before 60) and the store matrix (STORE=shadow: every document starts as in a build 60 shell, with the
  # shipped facade over a mock native store, and each browser close checks for drift). Same specs, same results.
  playwright:
    name: Playwright suites (${{ matrix.store }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        store: [classic, shadow]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci --no-fund --no-audit

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run suites
        env:
          STORE: ${{ matrix.store }}
        run: |
          set -o pipefail
          ./tests/run.sh 2>&1 | tee suite.log

      # Run logs need a GitHub login; annotations do not. Name each failing spec in the run summary.
      - name: Name the failures
        if: failure()
        run: |
          awk '/^── /{spec=$2} /  FAIL  /{line=$0; gsub(/%/,"%25",line); gsub(/\r/,"",line); print "::error title=" spec "::" substr(line,1,900)}' suite.log | head -20
