name: Web regression tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright suites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci --no-fund --no-audit

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run suites
        run: |
          set -o pipefail
          ./tests/run.sh 2>&1 | tee suite.log

      # Run logs need a GitHub login; annotations do not. Name each failing spec in the run summary.
      - name: Name the failures
        if: failure()
        run: |
          awk '/^── /{spec=$2} /FAIL/{line=$0; gsub(/%/,"%25",line); gsub(/\r/,"",line); print "::error title=" spec "::" substr(line,1,900)}' suite.log | head -20
