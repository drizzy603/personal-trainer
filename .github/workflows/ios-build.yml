name: iOS build

on:
  push:
    branches: [main, next]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'privacy.html'
      - 'package*.json'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/**'
      - 'tests/tools/scene-plist.sh'
  pull_request:
    paths:
      - 'index.html'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/**'
      - 'tests/tools/scene-plist.sh'
  workflow_dispatch:

# One run per ref: a newer push to main or next cancels the run still going for the older one.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# The two Xcodes, each named once (.github/scripts/select-xcode.sh selects /Applications/Xcode_<version>.app, which on
# GitHub's images follows that version's newest patch, and checks that it is that Xcode).
env:
  # The Xcode the app ships with: the owner's Mac archives with Xcode 27.1 (27A9275); this moves when that Mac's does.
  # GitHub has Xcode 27 only on the xcode-27 label, generally available since 2026-10-15 (GitHub's changelog of that
  # day; runner-images' README still badges it a preview). Its image of 2026-10-26 has macOS 27, Xcode 27.0, 27.1
  # (27A9275, the default) and 27.2 RC, and the iOS 27.0 and 27.1 runtimes, none of 26.x. macos-latest is macos-26
  # (image of 2026-10-26: Xcode 26.0.1 to 26.6, the iOS 26.2, 26.4.1 and 26.5 runtimes, no Xcode 27); both checked in
  # runner-images on 2026-11-02. The app build, fpkit-mac and fpkit-ios' iOS 27 parts run on xcode-27 with this Xcode.
  XCODE_SHIP: '27.1'
  # The newest Xcode on macos-26, the only image with iOS 26.x runtimes: fpkit-ios' iOS 26 parts (that job's comment).
  XCODE_FLOOR: '26.6'

jobs:
  # The App target as it ships: built by the Xcode the archive is made with (signing is the archive's business). A
  # build with macos-latest's Xcode 26.6 proved a compiler and SDK the app is never built with, and could pass where
  # 27.1 fails.
  build:
    name: Build (unsigned)
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Sync web assets into iOS bundle
        run: npm run sync

      - name: Select the Xcode the app ships with
        run: bash .github/scripts/select-xcode.sh "$XCODE_SHIP"

      - name: Build (no signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  # FPKit (ios/App/FPKit), the native half of the move to SwiftUI. FPCore and FPStore run on the Mac, compiled by the
  # Xcode the app ships with, on macOS 27 like the owner's Mac.
  fpkit-mac:
    name: FPKit tests on macOS (FPCore, FPStore)
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select the Xcode the app ships with
        run: bash .github/scripts/select-xcode.sh "$XCODE_SHIP"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        run: |
          set -o pipefail
          swift test --package-path ios/App/FPKit 2>&1 | tee "$RUNNER_TEMP/fpkit.log"

      # A run's log needs a login; annotations do not, so the failing lines go there.
      - name: Name the failures
        if: failure()
        run: |
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ')"
          .github/scripts/annotate-xc.sh "$RUNNER_TEMP/fpkit.log"

  # FPHost and FPUI keep every source inside #if os(iOS), so swift test on the Mac never compiles them.
  # This job builds every FPKit target for the iOS Simulator, then runs every FPKit test target on a
  # simulator: FPCoreTests, FPStoreTests (KillTests is macOS only), FPHostTests and FPUITests, all in the
  # FPKit-Package scheme. Three checks run first, in seconds: the CI scripts' own tests (.github/scripts/*-test.sh), the
  # warm-up lint (every test class that loads a web view warms WebKit: .github/scripts/fpkit-lint.sh) and the split's
  # check (below).
  #
  # Toolchains and runtimes. The whole suite runs on two runtimes, every part on an iPhone 17 Pro, the model of every
  # local run (.github/scripts/fpkit-sim.py makes one when the runtime has none). renders, tabs, stack and rest run on
  # xcode-27, built by Xcode 27.1 as the app is, on iOS 27.0, the runtime the Mac's gates run. The image also has iOS
  # 27.1, which no gate has run: fpkit-sim.py takes exactly the runtime a part names and says which newer one it left
  # out, and 27.1 parts come once the Mac has run the four groups there. The tab root and the native Coach tab support
  # iOS 26 and later (delta 14), FPKit iOS 17 and later, and xcode-27 has no iOS 26 runtime, so renders-26, tabs-26,
  # stack-26 and rest-26 run the same four groups on macos-26's newest iOS 26.x, 26.5, built by Xcode 26.6 (26.0 to
  # 26.4 run in no part). A 26 part tests iOS 26.5's own UIKit, SwiftUI and WebKit and its linked-on-or-after checks
  # (Xcode 26.6 links against the iOS 26.5 SDK, the runtime's own, and the runtime knows no later SDK, so the checks read
  # as they do for the app linked against 27.1); the compiler and the SDK's Swift code built into the client
  # (@inlinable, @_alwaysEmitIntoClient, @backDeployed) are Xcode 26.6's, not the app's. So FPKit must keep compiling
  # with Xcode 26.6: an API only the iOS 27 SDK declares does not compile there even behind #available (should FPKit need
  # one, the 26 parts move to xcode-27 and download the iOS 26.5 runtime on each run, gigabytes from Apple). The shipped
  # pair, Xcode 27.1's own build on iOS 26.x, runs on the Mac: every FPKit iOS gate runs the whole suite on iOS 26.5 and
  # 27.0 with the Xcode the app ships with, before every merge that touches FPKit (CLAUDE.md, the FPKit README). At
  # 16ee484 the 26.5 run's last part annotated ten failure lines (annotate-xc.sh kept ten then): they are the first ten
  # of ScreenHostTests and CoachHomeStoreTests under Xcode 27.1 on iOS 26.5 on the Mac, whose failures there are seven
  # cases; the two classes pass whole on 27.0 there.
  #
  # Parts, each on its own runner and simulator; .github/scripts/fpkit-parts.sh is the one place that names their
  # classes and each part's runtime, and it makes the parts from the groups (GROUP on 27.0, GROUP-26 on 26.5), so no
  # group runs on one runtime alone. renders, tabs and stack run the classes named there, rest runs everything else (it
  # skips exactly those, so a new test class always runs somewhere). A named class that no longer exists, a matrix that
  # leaves out a part, runs one the script does not know or puts one on another runtime (or leaves `ios` unquoted, which
  # GitHub reads as a number: 27.0 becomes 27), a part that executes no test, or a named class that ran nothing fails
  # the job.
  #
  # Time budget (the split rule): the test step prints its minutes as a notice; past 22 minutes it warns, and the parts
  # are rebalanced or split again. At 16ee484 (three parts on macos-26, Xcode 26.6, iOS 26.5) the test steps took 12.0
  # minutes (CoachHomeRenderTests and CoachRenderTests), 7.5 (ShellBridgeTabsTests, 34 tests) and 20.6 (every other
  # class, the failing cases' waits included): about 2.3 minutes of building the tests plus 2.8 times a calm Mac's
  # seconds for the same classes (its whole run of those tests on 27.0: renders 205 s, ShellBridgeTabsTests 110). The
  # seven failing cases took about 7.5 minutes on the Mac under CI's bounds, so for the last part's passing tests the 2.8
  # errs high. Another 8 to 9 minutes went outside the test steps (the first simulator boot 5.5 to 6.8), hence 40
  # minutes for the job, so the warning comes well before the job is cut off. With H10's and H11's tests
  # (ShellBridgeTabsTests 52, ScreenHostTests 61) a calm Mac takes about 200 s for renders, 230 for tabs, 200 for stack
  # and 95 for rest: about 12, 13, 12 and 7 minutes a test step by that rule, on either runtime, rest being the part
  # every new class joins, and a failing case's waits on top. xcode-27's runners are not measured yet.
  #
  # A run takes ten macOS runners (build, fpkit-mac and eight parts), and GitHub runs at most five macOS jobs at once
  # below its Enterprise plan: the parts run in two waves (time queued is not counted in timeout-minutes).
  fpkit-ios:
    name: FPKit on an iOS simulator (${{ matrix.part }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: renders, runner: xcode-27, xcode: ship, ios: '27.0' }
          - { part: tabs, runner: xcode-27, xcode: ship, ios: '27.0' }
          - { part: stack, runner: xcode-27, xcode: ship, ios: '27.0' }
          - { part: rest, runner: xcode-27, xcode: ship, ios: '27.0' }
          - { part: renders-26, runner: macos-26, xcode: floor, ios: '26.5' }
          - { part: tabs-26, runner: macos-26, xcode: floor, ios: '26.5' }
          - { part: stack-26, runner: macos-26, xcode: floor, ios: '26.5' }
          - { part: rest-26, runner: macos-26, xcode: floor, ios: '26.5' }

    steps:
      - uses: actions/checkout@v4

      # The scripts below check the tests' split, pick the simulator and name the failures; each *-test.sh beside them
      # runs that script on made-up inputs, so a script that would run the wrong classes, take another runtime or hide a
      # failure fails here, in seconds.
      - name: The CI scripts' own tests
        run: |
          for t in .github/scripts/*-test.sh; do
            echo "== $t"
            bash "$t" || exit 1
          done

      # A test class that makes a web view without warming WebKit first fails here, in seconds, with its file named.
      - name: WebKit warm-up lint
        run: bash .github/scripts/fpkit-lint.sh

      # Every class the split names must exist, and the matrix must run every part on its runtime, or tests would
      # quietly run nowhere (rest skips the named classes) or on one runtime only: checked before the toolchain and the
      # simulator, so a slip fails in seconds (the image's own Ruby reads the matrix).
      - name: Check the split
        run: bash .github/scripts/fpkit-parts.sh check

      - name: Select Xcode (${{ matrix.xcode }})
        run: |
          case "${{ matrix.xcode }}" in
            ship) v=$XCODE_SHIP ;;
            floor) v=$XCODE_FLOOR ;;
            *) echo "::error title=fpkit-ios matrix::xcode '${{ matrix.xcode }}' is neither ship nor floor"; exit 1 ;;
          esac
          bash .github/scripts/select-xcode.sh "$v"

      - name: Build every FPKit target for the iOS Simulator
        working-directory: ios/App/FPKit
        run: |
          set -o pipefail
          xcodebuild \
            -scheme FPKit-Package \
            -destination 'generic/platform=iOS Simulator' \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Pick an iPhone simulator
        id: sim
        run: |
          out=$(python3 .github/scripts/fpkit-sim.py "${{ matrix.ios }}") || { echo "$out"; exit 1; }
          echo "$out" >> "$GITHUB_OUTPUT"

      # A fresh runner's simulator spends minutes on its first boot; booting it before the tests keeps that wait out of
      # the first test that starts WebKit (KTUIProxyTests' first page load gave up after 362 s on a cold device).
      - name: Boot the simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # TEST_RUNNER_CI reaches the simulator's test process as CI (the speed bounds loosen on shared runners).
      - name: Test on the simulator (${{ matrix.part }})
        working-directory: ios/App/FPKit
        env:
          TEST_RUNNER_CI: 'true'
        run: |
          set -o pipefail
          parts="$GITHUB_WORKSPACE/.github/scripts/fpkit-parts.sh"
          args=$(bash "$parts" args "${{ matrix.part }}") || { echo "$args"; exit 1; }
          echo "part ${{ matrix.part }} on ${{ steps.sim.outputs.name }}: $args"
          start=$(date +%s)
          status=0
          xcodebuild \
            -scheme FPKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            $args \
            test 2>&1 | tee "$RUNNER_TEMP/test.log" || status=$?
          secs=$(( $(date +%s) - start ))
          mins=$(awk -v s="$secs" 'BEGIN { printf "%.1f", s / 60 }')
          echo "::notice title=fpkit-ios test minutes (${{ matrix.part }})::the test step took $mins minutes on ${{ steps.sim.outputs.name }} (rebalance or split the parts past 22: see the job's comment)"
          if [ "$secs" -gt $(( 22 * 60 )) ]; then
            echo "::warning title=fpkit-ios time budget (${{ matrix.part }})::the test step took $mins minutes, past 22: rebalance or split the parts (the job's comment)"
          fi
          if [ "$status" -eq 0 ] && ! bash "$parts" executed "${{ matrix.part }}" "$RUNNER_TEMP/test.log"; then
            status=1
          fi
          exit $status

      # A run's log needs a login; annotations do not, so the failing lines go there.
      - name: Name the failures
        if: failure()
        run: |
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ') on ${{ steps.sim.outputs.name }}"
          .github/scripts/annotate-xc.sh "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log"

  release:
    name: Archive + TestFlight upload
    if: false
    runs-on: macos-latest
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Bump build number + sync web
        run: ./release-ios.sh

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

      - name: Archive
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export IPA
        working-directory: ios/App
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/App.xcarchive/Products/Applications/App.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
