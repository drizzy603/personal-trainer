name: iOS build

on:
  push:
    branches: [main, next]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'privacy.html'
      - 'package*.json'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/**'
      - 'tests/tools/scene-plist.sh'
  pull_request:
    paths:
      - 'index.html'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/**'
      - 'tests/tools/scene-plist.sh'
  workflow_dispatch:

# One run per ref: a newer push to main or next cancels the run still going for the older one.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# The two Xcodes, each named once (.github/scripts/select-xcode.sh selects /Applications/Xcode_<version>.app, which on
# GitHub's images follows that version's newest patch, and checks that it is that Xcode).
env:
  # The Xcode the app ships with: the owner's Mac archives with Xcode 27.1 (27A9275); this moves when that Mac's does.
  # GitHub has Xcode 27 only on the xcode-27 label, a public preview (runner-images issue 14404: no SLA, and queueing
  # while capacity grows). Its image of 2026-10-26 has macOS 27, Xcode 27.0, 27.1 (27A9275, the default) and 27.2 RC,
  # and the iOS 27.0 and 27.1 runtimes, none of 26.x. macos-latest is macos-26 (image of 2026-10-13: Xcode 26.0.1 to
  # 26.6, the iOS 26.2, 26.4.1 and 26.5 runtimes). The app build, fpkit-mac and fpkit-ios' iOS 27 parts run on xcode-27
  # with this Xcode; when GitHub gives Xcode 27 a GA label (or drops the preview's), move their runs-on there.
  XCODE_SHIP: '27.1'
  # The newest Xcode on macos-26, the only image with iOS 26.x runtimes: fpkit-ios' iOS 26 parts (that job's comment).
  XCODE_FLOOR: '26.6'

jobs:
  # The App target as it ships: built by the Xcode the archive is made with (signing is the archive's business). A
  # build with macos-latest's Xcode 26.6 proved a compiler and SDK the app is never built with, and could pass where
  # 27.1 fails.
  build:
    name: Build (unsigned)
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Sync web assets into iOS bundle
        run: npm run sync

      - name: Select the Xcode the app ships with
        run: bash .github/scripts/select-xcode.sh "$XCODE_SHIP"

      - name: Build (no signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  # FPKit (ios/App/FPKit), the native half of the move to SwiftUI. FPCore and FPStore run on the Mac, compiled by the
  # Xcode the app ships with, on macOS 27 like the owner's Mac.
  fpkit-mac:
    name: FPKit tests on macOS (FPCore, FPStore)
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select the Xcode the app ships with
        run: bash .github/scripts/select-xcode.sh "$XCODE_SHIP"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        run: |
          set -o pipefail
          swift test --package-path ios/App/FPKit 2>&1 | tee "$RUNNER_TEMP/fpkit.log"

      # A run's log needs a login; annotations do not, so the failing lines go there.
      - name: Name the failures
        if: failure()
        run: |
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ')"
          .github/scripts/annotate-xc.sh "$RUNNER_TEMP/fpkit.log"

  # FPHost and FPUI keep every source inside #if os(iOS), so swift test on the Mac never compiles them.
  # This job builds every FPKit target for the iOS Simulator, then runs every FPKit test target on a
  # simulator: FPCoreTests, FPStoreTests (KillTests is macOS only), FPHostTests and FPUITests, all in the
  # FPKit-Package scheme. Two checks run first, in seconds: the warm-up lint (every test class that loads a web view
  # warms WebKit: .github/scripts/fpkit-lint.sh) and the split's check (below).
  #
  # Toolchains and runtimes. Every part runs on an iPhone 17 Pro, the model of every local run
  # (.github/scripts/fpkit-sim.py makes one when the runtime has none). renders, tabs, stack and rest run on xcode-27,
  # built by Xcode 27.1 as the app is, on the newest iOS 27.x there that runs that model (27.1 on the image of
  # 2026-10-26; the Mac's gates run 27.0). The tab root and the native Coach tab support iOS 26 and later (delta 14) and
  # xcode-27 has no iOS 26 runtime, so tabs-26 and stack-26 run tabs' and stack's classes, the ones that drive UIKit's
  # tab bar and the Coach tab's navigation stack, again on macos-26's newest iOS 26.x (26.5), built by Xcode 26.6. That
  # is the floor's own UIKit and SwiftUI, which go by the runtime and by an SDK of at least 26 (true of both Xcodes),
  # under an older compiler than the app's. (The four cases that failed at 16ee484 under Xcode 26.6 on iOS 26.5 fail
  # line for line under Xcode 27.1 on iOS 26.5 on the owner's Mac, and pass in its gates on 27.0.) So FPKit must keep
  # compiling with Xcode 26.6: an API only the iOS 27 SDK declares does not compile there even behind #available. Should
  # FPKit need one, those two parts move to xcode-27 and download the iOS 26.5 runtime on each run (8.5 GB from Apple).
  # Only the Mac runs Xcode 27.1's own build on iOS 26.x, and the other classes on iOS 26.x (every local FPKit gate runs
  # on iOS 26.5 and 27.0).
  #
  # Parts, each on its own runner and simulator; .github/scripts/fpkit-parts.sh is the one place that names their
  # classes and each part's iOS major. renders, tabs and stack run the classes named there, rest runs everything else
  # (it skips exactly those, so a new test class always runs somewhere). A named class that no longer exists, a matrix
  # that leaves out a part, runs one the script does not know or puts one on another iOS major, a part that executes no
  # test, or a named class that ran nothing fails the job.
  #
  # Time budget (the split rule): the test step prints its minutes as a notice; past 22 minutes it warns, and the parts
  # are rebalanced or split again. At 16ee484 (three parts on macos-26, Xcode 26.6, iOS 26.5) the test steps took 12.0
  # minutes (CoachHomeRenderTests and CoachRenderTests), 7.5 (ShellBridgeTabsTests, 34 tests) and 20.6 (every other
  # class, three failures' waits included), each building its tests first: about three times a calm Mac's run of the
  # same classes, one and a half times a busy one's. Another 8 to 9 minutes went outside them (the first simulator boot
  # 5.5 to 6.8), hence 40 minutes for the job, so the warning comes well before the job is cut off. On a calm Mac, with
  # H10's and H11's classes, renders takes about 220 s, tabs 190, stack 250 and rest 140 (fpkit-parts.sh): about 12,
  # 11, 14 and 9 minutes here, rest being the part every new class joins.
  #
  # A run takes eight macOS runners (build, fpkit-mac and six parts), and GitHub runs at most five macOS jobs at once
  # below its Enterprise plan: the last parts can wait for a runner (time queued is not counted in timeout-minutes).
  fpkit-ios:
    name: FPKit on an iOS simulator (${{ matrix.part }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: renders, runner: xcode-27, xcode: ship, ios: 27 }
          - { part: tabs, runner: xcode-27, xcode: ship, ios: 27 }
          - { part: stack, runner: xcode-27, xcode: ship, ios: 27 }
          - { part: rest, runner: xcode-27, xcode: ship, ios: 27 }
          - { part: tabs-26, runner: macos-26, xcode: floor, ios: 26 }
          - { part: stack-26, runner: macos-26, xcode: floor, ios: 26 }

    steps:
      - uses: actions/checkout@v4

      # A test class that makes a web view without warming WebKit first fails here, in seconds, with its file named.
      - name: WebKit warm-up lint
        run: bash .github/scripts/fpkit-lint.sh

      # Every class the split names must exist, and the matrix must run every part on its iOS major, or tests would
      # quietly run nowhere (rest skips the named classes) or on one runtime only: checked before the toolchain and the
      # simulator, so a slip fails in seconds (the image's own Ruby reads the matrix).
      - name: Check the split
        run: bash .github/scripts/fpkit-parts.sh check

      - name: Select Xcode (${{ matrix.xcode }})
        run: |
          case "${{ matrix.xcode }}" in
            ship) v=$XCODE_SHIP ;;
            floor) v=$XCODE_FLOOR ;;
            *) echo "::error title=fpkit-ios matrix::xcode '${{ matrix.xcode }}' is neither ship nor floor"; exit 1 ;;
          esac
          bash .github/scripts/select-xcode.sh "$v"

      - name: Build every FPKit target for the iOS Simulator
        working-directory: ios/App/FPKit
        run: |
          set -o pipefail
          xcodebuild \
            -scheme FPKit-Package \
            -destination 'generic/platform=iOS Simulator' \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Pick an iPhone simulator
        id: sim
        run: |
          out=$(python3 .github/scripts/fpkit-sim.py "${{ matrix.ios }}") || { echo "$out"; exit 1; }
          echo "$out" >> "$GITHUB_OUTPUT"

      # A fresh runner's simulator spends minutes on its first boot; booting it before the tests keeps that wait out of
      # the first test that starts WebKit (KTUIProxyTests' first page load gave up after 362 s on a cold device).
      - name: Boot the simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # TEST_RUNNER_CI reaches the simulator's test process as CI (the speed bounds loosen on shared runners).
      - name: Test on the simulator (${{ matrix.part }})
        working-directory: ios/App/FPKit
        env:
          TEST_RUNNER_CI: 'true'
        run: |
          set -o pipefail
          parts="$GITHUB_WORKSPACE/.github/scripts/fpkit-parts.sh"
          args=$(bash "$parts" args "${{ matrix.part }}") || { echo "$args"; exit 1; }
          echo "part ${{ matrix.part }} on ${{ steps.sim.outputs.name }}: $args"
          start=$(date +%s)
          status=0
          xcodebuild \
            -scheme FPKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            $args \
            test 2>&1 | tee "$RUNNER_TEMP/test.log" || status=$?
          secs=$(( $(date +%s) - start ))
          mins=$(awk -v s="$secs" 'BEGIN { printf "%.1f", s / 60 }')
          echo "::notice title=fpkit-ios test minutes (${{ matrix.part }})::the test step took $mins minutes on ${{ steps.sim.outputs.name }} (rebalance or split the parts past 22: see the job's comment)"
          if [ "$secs" -gt $(( 22 * 60 )) ]; then
            echo "::warning title=fpkit-ios time budget (${{ matrix.part }})::the test step took $mins minutes, past 22: rebalance or split the parts (the job's comment)"
          fi
          if [ "$status" -eq 0 ] && ! bash "$parts" executed "${{ matrix.part }}" "$RUNNER_TEMP/test.log"; then
            status=1
          fi
          exit $status

      # A run's log needs a login; annotations do not, so the failing lines go there.
      - name: Name the failures
        if: failure()
        run: |
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ') on ${{ steps.sim.outputs.name }}"
          .github/scripts/annotate-xc.sh "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log"

  release:
    name: Archive + TestFlight upload
    if: false
    runs-on: macos-latest
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Bump build number + sync web
        run: ./release-ios.sh

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

      - name: Archive
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export IPA
        working-directory: ios/App
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/App.xcarchive/Products/Applications/App.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
