name: iOS build

on:
  push:
    branches: [main, next]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'privacy.html'
      - 'package*.json'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/**'
      - 'tests/tools/scene-plist.sh'
  pull_request:
    paths:
      - 'index.html'
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/**'
      - 'tests/tools/scene-plist.sh'
  workflow_dispatch:

# One run per ref: a newer push to main or next cancels the run still going for the older one.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Sync web assets into iOS bundle
        run: npm run sync

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (no signing)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  # FPKit (ios/App/FPKit), the native half of the move to SwiftUI. FPCore and FPStore run on the Mac.
  fpkit-mac:
    name: FPKit tests on macOS (FPCore, FPStore)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        run: |
          set -o pipefail
          swift test --package-path ios/App/FPKit 2>&1 | tee "$RUNNER_TEMP/fpkit.log"

      # A run's log needs a login; annotations do not, so the failing lines go there.
      - name: Name the failures
        if: failure()
        run: |
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ')"
          .github/scripts/annotate-xc.sh "$RUNNER_TEMP/fpkit.log"

  # FPHost and FPUI keep every source inside #if os(iOS), so swift test on the Mac never compiles them.
  # This job builds every FPKit target for the iOS Simulator, then runs every FPKit test target on a
  # simulator: FPCoreTests, FPStoreTests (KillTests is macOS only), FPHostTests and FPUITests, all in the
  # FPKit-Package scheme. The warm-up lint runs first: every test class that loads a web view warms WebKit
  # (.github/scripts/fpkit-lint.sh).
  #
  # Time budget (the split rule): the test step prints its minutes as a notice; past 22 of the job's 30
  # minutes it warns, and the job is split again. Build 61's drain (ee0557a) took the single job past 30
  # minutes (FPUITests about 19-24 minutes on a calm Mac, CI slower), so it runs as three parts, each on its
  # own runner and simulator: `renders` and `tabs` run the classes named in RENDERS and TABS, `rest` runs
  # everything else (it skips exactly those names, so a new test class always runs somewhere). A named class
  # that no longer exists fails the job, and so does a part that executes no test.
  fpkit-ios:
    name: FPKit on an iOS simulator (${{ matrix.part }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [renders, tabs, rest]
    env:
      RENDERS: FPUITests/CoachHomeRenderTests FPUITests/CoachRenderTests
      TABS: FPUITests/ShellBridgeTabsTests

    steps:
      - uses: actions/checkout@v4

      # A test class that makes a web view without warming WebKit first fails here, in seconds, with its file named.
      - name: WebKit warm-up lint
        run: bash .github/scripts/fpkit-lint.sh

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build every FPKit target for the iOS Simulator
        working-directory: ios/App/FPKit
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -scheme FPKit-Package \
            -destination 'generic/platform=iOS Simulator' \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The newest iOS runtime's first available iPhone; device names change with every Xcode.
      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/sims.json"
          udid=$(python3 - "$RUNNER_TEMP/sims.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          best = None
          for runtime, items in devices.items():
              tail = runtime.rsplit(".", 1)[-1]          # iOS-26-5
              if not tail.startswith("iOS-"):
                  continue
              version = tuple(int(p) for p in tail[4:].split("-"))
              for d in items:
                  if d.get("isAvailable", True) and d["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, d["udid"], d["name"])
          if best is None:
              sys.exit("no available iPhone simulator")
          print("simulator: %s, iOS %s" % (best[2], ".".join(map(str, best[0]))), file=sys.stderr)
          print(best[1])
          print("%s, iOS %s" % (best[2], ".".join(map(str, best[0]))))
          PY
          )
          echo "udid=$(echo "$udid" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$udid" | sed -n 2p)" >> "$GITHUB_OUTPUT"

      # A fresh runner's simulator spends minutes on its first boot; booting it before the tests keeps that wait out of
      # the first test that starts WebKit (KTUIProxyTests' first page load gave up after 362 s on a cold device).
      - name: Boot the simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # Every class the split names must exist, or its tests would quietly run nowhere but `rest`.
      - name: Check the split's class names
        working-directory: ios/App/FPKit/Tests
        run: |
          for t in $RENDERS $TABS; do
            target=${t%%/*}; cls=${t#*/}
            if ! grep -rqE "class ${cls}[: ]" "$target"; then
              echo "::error title=fpkit-ios split::$t is named in the job's split but no such class exists in Tests/$target"
              exit 1
            fi
          done

      # TEST_RUNNER_CI reaches the simulator's test process as CI (the speed bounds loosen on shared runners).
      - name: Test on the simulator (${{ matrix.part }})
        working-directory: ios/App/FPKit
        env:
          TEST_RUNNER_CI: 'true'
        run: |
          set -o pipefail
          case "${{ matrix.part }}" in
            renders) args=$(for t in $RENDERS; do printf -- '-only-testing:%s ' "$t"; done) ;;
            tabs) args=$(for t in $TABS; do printf -- '-only-testing:%s ' "$t"; done) ;;
            rest) args=$(for t in $RENDERS $TABS; do printf -- '-skip-testing:%s ' "$t"; done) ;;
          esac
          echo "part ${{ matrix.part }}: $args"
          start=$(date +%s)
          status=0
          xcodebuild \
            -scheme FPKit-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            $args \
            test 2>&1 | tee "$RUNNER_TEMP/test.log" || status=$?
          secs=$(( $(date +%s) - start ))
          mins=$(awk -v s="$secs" 'BEGIN { printf "%.1f", s / 60 }')
          echo "::notice title=fpkit-ios test minutes (${{ matrix.part }})::the test step took $mins minutes (split again past 22 of 30: see the job's comment)"
          if [ "$secs" -gt $(( 22 * 60 )) ]; then
            echo "::warning title=fpkit-ios time budget (${{ matrix.part }})::the test step took $mins minutes, past 22: split the job again (the job's comment)"
          fi
          if [ "$status" -eq 0 ] && ! grep -qE "Executed [1-9][0-9]* tests?," "$RUNNER_TEMP/test.log"; then
            echo "::error title=fpkit-ios split::part ${{ matrix.part }} executed no test"
            status=1
          fi
          exit $status

      # A run's log needs a login; annotations do not, so the failing lines go there.
      - name: Name the failures
        if: failure()
        run: |
          echo "::notice title=toolchain::$(xcodebuild -version | tr '\n' ' ') on ${{ steps.sim.outputs.name }}"
          .github/scripts/annotate-xc.sh "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log"

  release:
    name: Archive + TestFlight upload
    if: false
    runs-on: macos-latest
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Bump build number + sync web
        run: ./release-ios.sh

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

      - name: Archive
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export IPA
        working-directory: ios/App
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/App.xcarchive/Products/Applications/App.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
